<!doctype html>
<!--
  Static mock of the chat composer's AI disclaimer (docs/design/chat-disclaimer/SPEC.md). Not
  product code. Open directly in a browser. Query params:
    variant = today | a (default) | b
              today: what is built (the disclaimer under the text composer only: the row jumps)
              a:     one line in every surface (a fixed meta row under the composer)
              b:     said once, at the start (under the greeting; counter and too-long above the row)
    state   = empty | text (default) | counter | toolong | connecting | call | callChat | ended
    guide   = draw a pink line along the bottom edge of the composer row (the strips in render.sh)
    measure = write the measured composer, row and stage boxes into <html data-measure> (render.sh
              reads them with --dump-dom)
  At >= 600 px: the floating panel (400 x 600) bottom-right over the unmoved page (the overlay; the
  slide only moves the page). Below 600 px or 499 px tall: the phone's one bottom sheet of CV-222
  (every surface in the call's sheet, --voice-sheet-height).
  The page behind is the voice package's production screenshot (docs/design/voice/assets).
  Screenshots: render.sh next to this file.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat disclaimer mock</title>
    <!-- Real tokens. The theme self-hosts Figtree / JetBrains Mono under Vite; Google Fonts here. -->
    <link rel="stylesheet" href="../../../src/theme/tokens.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block"
    />
    <style>
      /* Variant A (SPEC → Variant A → Room): the composer is 26 px taller during a call; the
         short sheet (landscape phones) grows by 26 to keep its 120 px stage. */
      html.variant-a {
        --voice-sheet-height-short: calc(298px + env(safe-area-inset-bottom));
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: var(--font-sans);
        font-size: var(--chat-ui-size);
        line-height: var(--chat-ui-line-height);
        color: var(--color-ink);
        background: var(--color-page) no-repeat top center / 100% auto;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
      }
      button {
        font: inherit;
      }
      p,
      h2,
      ol {
        margin: 0;
      }

      .icon {
        display: block;
        flex: none;
        width: var(--chat-icon-size);
        height: var(--chat-icon-size);
        background: currentColor;
        mask: var(--src) center / contain no-repeat;
      }
      .i-mic {
        --src: url(../../../src/shared/chat/assets/chat_icon_mic.svg);
      }
      .i-end {
        --src: url(../../../src/shared/chat/assets/chat_icon_end.svg);
      }
      .i-sparkle {
        --src: url(../../../src/shared/chat/assets/chat_icon_sparkle.svg);
      }
      .i-send {
        --src: url(../../../src/shared/chat/assets/chat_icon_send.svg);
      }
      .i-collapse {
        --src: url(../../../src/shared/chat/assets/chat_icon_collapse.svg);
      }
      .i-call {
        --src: url(../../../src/screens/chat/voice/assets/chat_voice_icon_call.svg);
      }

      .caption {
        font-family: var(--font-mono);
        font-size: var(--chat-caption-size);
        line-height: var(--chat-caption-line-height);
        color: var(--chat-ink-2);
      }
      .badge {
        flex: none;
        width: var(--chat-badge-size);
        height: var(--chat-badge-size);
        display: grid;
        place-items: center;
        color: var(--color-on-accent);
        background: var(--gradient-brand-tile);
        border-radius: 50%;
      }

      /* ---- The panel: the one floating frame above the phone ---- */
      .frame {
        position: fixed;
        right: var(--space-4);
        bottom: var(--space-4);
        z-index: var(--chat-z-index);
        width: var(--chat-panel-width);
        height: min(var(--chat-panel-height), calc(100dvh - 2 * var(--space-4)));
        display: flex;
        flex-direction: column;
        overflow: hidden;
        color: var(--color-dark-ink);
        background: var(--gradient-dark);
        border: var(--border-card) solid var(--color-dark-line);
        border-radius: var(--radius-card);
        box-shadow: var(--chat-shadow-panel);
      }

      /* ChatCardHeader anatomy. */
      .header {
        flex: none;
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-3) var(--space-2) var(--space-3) var(--space-5);
        border-bottom: var(--border-card) solid var(--color-dark-line);
      }
      .titles {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: calc(var(--space-1) / 2);
      }
      .title {
        font-size: var(--chat-title-size);
        line-height: var(--chat-ui-line-height);
        font-weight: var(--type-card-title-weight);
        letter-spacing: var(--type-card-title-letter-spacing);
      }
      .sub {
        display: flex;
        align-items: center;
        gap: var(--space-1-5);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .sub b {
        font-weight: var(--type-medium-weight);
        color: var(--color-dark-ink);
      }
      .sub .live {
        color: var(--color-dark-number);
      }
      .ring {
        flex: none;
        width: var(--chat-action-icon-size);
        height: var(--chat-action-icon-size);
        transform: rotate(-90deg);
      }
      .ring .track {
        stroke: var(--color-dark-line);
      }
      .ring .done {
        stroke: var(--color-dark-ink);
        stroke-linecap: round;
      }
      .icon-btn {
        flex: none;
        width: var(--chat-control-size);
        height: var(--chat-control-size);
        display: grid;
        place-items: center;
        padding: 0;
        color: var(--color-dark-ink);
        background: transparent;
        border: 0;
        border-radius: 50%;
      }
      .btn-secondary {
        flex: none;
        min-height: var(--chat-secondary-button-height);
        padding: 0 var(--space-4);
        font-size: var(--chat-ui-size);
        line-height: var(--chat-ui-line-height);
        font-weight: var(--type-button-weight);
        color: var(--color-dark-ink);
        background: transparent;
        border: var(--border-card) solid var(--chat-ink-2);
        border-radius: var(--radius-pill);
        white-space: nowrap;
      }
      .toggle {
        min-width: var(--voice-chat-toggle-width);
      }

      /* ---- Stage: orb, status, caption, privacy ---- */
      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--space-4) var(--space-6);
        text-align: center;
      }
      .status {
        margin-top: var(--space-3);
        font-family: var(--font-mono);
        font-size: var(--type-label-size);
        line-height: var(--chat-caption-line-height);
        letter-spacing: var(--type-label-letter-spacing);
        color: var(--color-dark-number);
      }
      .say {
        width: 100%;
        min-height: calc(var(--voice-caption-lines) * 1em * var(--type-loop-lead-line-height));
        margin-top: var(--space-3);
        font-size: var(--type-loop-lead-size);
        line-height: var(--type-loop-lead-line-height);
        letter-spacing: var(--type-loop-lead-letter-spacing);
        color: var(--color-dark-ink);
        display: -webkit-box;
        -webkit-line-clamp: var(--voice-caption-lines);
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .say.visitor {
        color: var(--chat-ink-2);
      }
      .privacy {
        margin-top: var(--space-3);
      }

      /* ---- The orb (the voice package's, static here) ---- */
      .orb {
        --orb: var(--voice-orb-size);
        position: relative;
        flex: none;
        width: var(--orb);
        height: var(--orb);
        margin-block: calc(var(--orb) * 0.1);
      }
      .orb .glow {
        position: absolute;
        inset: -22%;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          var(--voice-glow-pink),
          var(--voice-glow-violet) 55%,
          transparent
        );
        filter: blur(var(--space-6));
        opacity: 0.6;
      }
      .orb .body {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 50%;
        box-shadow: var(--voice-orb-shadow);
        background: radial-gradient(
          circle at 50% 60%,
          var(--color-brand-violet),
          var(--color-accent)
        );
      }
      .orb .swirl {
        position: absolute;
        inset: -30%;
        background: var(--voice-orb-gradient);
        filter: blur(var(--voice-orb-blur));
      }
      .orb .shade {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background:
          radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.75), transparent 38%),
          radial-gradient(circle at 50% 120%, rgba(42, 31, 61, 0.35), transparent 60%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
      }
      .connecting .orb {
        transform: scale(0.82);
      }
      .connecting .orb .body {
        filter: saturate(0.45);
        opacity: 0.85;
      }
      .connecting .orb .glow {
        opacity: 0.35;
      }
      .orb.mini {
        --orb: var(--voice-orb-size-mini);
        margin: 0;
      }
      .orb.mini .glow {
        display: none;
      }
      .orb.mini .swirl {
        filter: blur(calc(var(--voice-orb-blur) / 3));
      }
      .orb.mini .body {
        box-shadow: none;
      }

      /* ---- The conversation ---- */
      .list {
        flex: 1;
        min-height: 0;
        margin: 0;
        padding: var(--space-4) var(--space-5);
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        overflow: hidden;
        list-style: none;
      }
      /* With a conversation the list shows its end (scrolled down). */
      .list.end {
        justify-content: flex-end;
      }
      .row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-1);
      }
      .row.visitor {
        align-items: flex-end;
      }
      .bubble {
        max-width: 100%;
        font-size: var(--chat-text-size);
        line-height: var(--chat-text-line-height);
        border-radius: var(--radius-tile);
      }
      .visitor .bubble {
        max-width: var(--chat-bubble-max-width);
        padding: var(--space-3) var(--space-4);
        color: var(--color-ink);
        background: var(--color-surface-lilac);
        border-bottom-right-radius: var(--chat-radius-tail);
      }
      .assistant .bubble {
        padding: var(--space-3) calc(var(--space-4) - var(--border-card));
        border: var(--border-card) solid var(--color-dark-line);
        border-bottom-left-radius: var(--chat-radius-tail);
      }
      /* Variant B: the disclaimer under the greeting, the row's own caption (as a chip under an
         answer: the row's 4 px gap), 16 px in from the bubble's edge like the bubble's text. */
      .greeting-note {
        padding-inline: var(--space-4);
      }
      .group {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-2);
      }
      .group .label {
        margin-top: var(--space-1);
        letter-spacing: var(--type-label-letter-spacing);
        color: var(--color-dark-number);
      }
      .suggestion {
        max-width: 100%;
        min-height: var(--chat-secondary-button-height);
        padding: var(--space-2) var(--space-4);
        text-align: left;
        color: var(--color-dark-ink);
        background: var(--chat-fill);
        border: var(--border-card) solid var(--color-dark-line);
        border-radius: var(--radius-tile);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-1) var(--space-3);
        color: var(--color-dark-ink);
        border: var(--border-card) solid var(--color-dark-line);
        border-radius: var(--radius-pill);
      }
      .chip .icon,
      .divider .icon {
        width: var(--chat-action-icon-size);
        height: var(--chat-action-icon-size);
        color: var(--color-dark-number);
      }
      .divider {
        display: flex;
        align-items: center;
        gap: var(--space-3);
      }
      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        border-top: var(--border-card) solid var(--color-dark-line);
      }
      .divider span {
        display: inline-flex;
        align-items: center;
        gap: var(--space-1-5);
      }

      /* ---- The composer ---- */
      .composer {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        padding: var(--space-3) var(--space-5) var(--space-4);
        border-top: var(--border-card) solid var(--color-dark-line);
      }
      .composer-row {
        position: relative;
        display: flex;
        align-items: flex-end;
        gap: var(--space-2);
      }
      .field {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: flex-end;
        gap: var(--space-2);
        padding: 5px 5px 5px 15px;
        background: var(--chat-fill);
        border: var(--border-card) solid var(--color-ink-4);
        border-radius: var(--radius-card);
      }
      .field.focus {
        border-color: var(--color-dark-number);
        box-shadow: 0 0 0 var(--border-card) var(--color-dark-number);
      }
      .field.invalid {
        border-color: var(--chat-error);
        box-shadow: 0 0 0 var(--border-card) var(--chat-error);
      }
      .field.off {
        opacity: 0.5;
      }
      .field span {
        flex: 1;
        min-width: 0;
        padding: 10px 0;
        font-size: var(--chat-text-size);
        line-height: var(--chat-text-line-height);
        color: var(--chat-ink-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .field span.draft {
        color: var(--color-dark-ink);
      }
      /* A long draft: the textarea at its cap (6 lines), scrolled to its end. */
      .field span.long {
        height: calc(6 * var(--chat-text-line-height));
        margin-block: 10px;
        padding-block: 0;
        white-space: normal;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .send {
        flex: none;
        width: var(--chat-control-size);
        height: var(--chat-control-size);
        display: grid;
        place-items: center;
        color: var(--color-ink-4);
        background: var(--chat-fill-hover);
        border: 0;
        border-radius: 50%;
      }
      .send.on {
        color: var(--color-on-accent);
        background: var(--gradient-brand-tile);
      }
      .round,
      .ctl {
        flex: none;
        height: var(--voice-control-size);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        padding: 0;
        font-size: var(--type-button-size);
        font-weight: var(--type-button-weight);
        white-space: nowrap;
        color: var(--color-dark-ink);
        background: var(--chat-fill);
        border: var(--border-card) solid var(--color-dark-line);
        border-radius: var(--radius-pill);
      }
      .round {
        width: var(--voice-control-size);
      }
      .ctl {
        padding: 0 var(--space-5) 0 var(--space-4);
      }
      .round .icon,
      .ctl .icon {
        width: var(--voice-control-icon-size);
        height: var(--voice-control-icon-size);
      }
      .round:disabled {
        color: var(--color-ink-4);
        background: transparent;
      }
      .round.end {
        color: var(--color-ink);
        background: var(--color-card);
        border-color: transparent;
      }
      .ctl.call {
        color: var(--color-on-accent);
        background: var(--gradient-brand);
        border-color: transparent;
      }

      /* The meta row: the disclaimer or the too-long message, and the counter. */
      .meta {
        display: flex;
        justify-content: space-between;
        gap: var(--space-3);
      }
      .meta .counter {
        flex: none;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .meta .error {
        color: var(--chat-error);
      }
      /* Variant A: one line, always there, never wraps. */
      .meta.fixed {
        height: var(--chat-caption-line-height);
        white-space: nowrap;
      }
      .meta.fixed > :first-child {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ?guide: the composer row's bottom edge, across the whole viewport. */
      .guide {
        position: fixed;
        left: 0;
        right: 0;
        z-index: calc(var(--chat-z-index) + 1);
        height: 0;
        border-top: 2px dashed var(--color-dark-number);
        pointer-events: none;
      }

      /* ---- Phone (CV-222): every chat surface in the call's bottom sheet ---- */
      @media (max-width: 599px), (max-height: 499px) {
        :root {
          --voice-orb-size: var(--voice-orb-size-small);
          --voice-caption-lines: 2;
        }
        .frame {
          left: 0;
          right: 0;
          bottom: 0;
          width: auto;
          height: var(--voice-sheet-height);
          border-bottom: 0;
          border-radius: var(--radius-card) var(--radius-card) 0 0;
        }
        .header {
          padding-left: var(--space-4);
        }
        .stage {
          padding-inline: var(--space-4);
        }
        .list,
        .composer {
          padding-inline: var(--space-4);
        }
        .composer {
          padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom));
        }
      }
      @media (max-height: 499px) {
        .frame {
          height: var(--voice-sheet-height-short);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const p = new URLSearchParams(location.search);
      const variant = ['today', 'a', 'b'].includes(p.get('variant')) ? p.get('variant') : 'a';
      const state = p.get('state') || 'text';
      const phone = matchMedia('(max-width: 599px), (max-height: 499px)').matches;
      document.documentElement.classList.add(`variant-${variant}`);

      // ---- Copy per variant (SPEC → Texts) ----
      const FULL_DISCLAIMER = 'Answers are AI-generated and may contain mistakes.';
      const copy = {
        today: {
          disclaimer: FULL_DISCLAIMER,
          tooLong: 'Shorten your question to 1000 characters or fewer.',
          privacy:
            'Calls run on ElevenLabs. Voice and text share one history. AI can make mistakes.',
        },
        a: {
          disclaimer: 'AI can make mistakes.',
          tooLong: 'Shorten to 1000 characters.',
          // Not on the stage: the fine-print line says it while the call connects.
          privacy: '',
          finePrintConnecting: 'Calls run on ElevenLabs and see your chat.',
        },
        b: {
          disclaimer: FULL_DISCLAIMER,
          tooLong: 'Shorten your question to 1000 characters or fewer.',
          privacy:
            'Calls run on ElevenLabs. Voice and text share one history. AI can make mistakes.',
        },
      }[variant];

      const icon = (name) => `<span class="icon i-${name}" aria-hidden="true"></span>`;
      const ring = (sec) => {
        const c = 2 * Math.PI * 5.5;
        const done = ((sec / 180) * c).toFixed(1);
        return `<svg class="ring" viewBox="0 0 14 14" aria-hidden="true"><circle class="track" cx="7" cy="7" r="5.5" fill="none" stroke-width="2"/><circle class="done" cx="7" cy="7" r="5.5" fill="none" stroke-width="2" stroke-dasharray="${done} ${c}"/></svg>`;
      };
      const orb = (mini) =>
        `<div class="orb${mini ? ' mini' : ''}" aria-hidden="true"><div class="glow"></div><div class="body"><div class="swirl"></div></div><div class="shade"></div></div>`;
      const timer = (sec) =>
        `<p class="sub caption" role="timer">${ring(sec)}<b>${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}</b> / 3:00</p>`;
      const collapse = (label = 'Collapse chat') =>
        `<button type="button" class="icon-btn" aria-label="${label}" aria-expanded="true">${icon('collapse')}</button>`;
      const toggle = (open) =>
        `<button type="button" class="btn-secondary toggle">${open ? 'Hide chat' : 'Show chat'}</button>`;

      const chatHeader = `<header class="header"><span class="badge" aria-hidden="true">${icon('sparkle')}</span><div class="titles"><h2 class="title">Ask about Andrew</h2><p class="caption">AI assistant · answers from this page</p></div>${collapse()}</header>`;
      const callHeader = (sub) =>
        `<header class="header"><span class="badge" aria-hidden="true">${icon('sparkle')}</span><div class="titles"><h2 class="title">Voice call</h2>${sub}</div>${toggle(false)}${collapse('Collapse chat. The call goes on.')}</header>`;
      const callChatHeader = `<header class="header">${orb(true)}<div class="titles"><h2 class="title">Voice call</h2><p class="sub caption"><span class="live">Listening</span> · <b>1:12</b></p></div>${toggle(true)}${collapse('Collapse chat. The call goes on.')}</header>`;

      // ---- The composer ----
      const LONG_DRAFT =
        'I’m hiring for a senior Android lead on a fintech app with offline-first payments, a Kotlin Multiplatform core shared with iOS, and a design system in Compose. The team is six engineers across Warsaw and Lisbon. Could you tell me how Andrew has handled a migration like this, which metrics he tracked, how he worked with product and design, and whether he has led code reviews and hiring loops at this scale before?';
      const field = ({
        text,
        draft = false,
        focus = false,
        off = false,
        long = false,
        invalid = false,
      }) =>
        `<div class="field${focus ? ' focus' : ''}${off ? ' off' : ''}${invalid ? ' invalid' : ''}"><span class="${[draft && 'draft', long && 'long'].filter(Boolean).join(' ')}">${text}</span><button type="button" class="send${draft && !invalid ? ' on' : ''}" aria-label="Send" ${draft && !invalid ? '' : 'disabled'}>${icon('send')}</button></div>`;
      const callButton = `<button type="button" class="ctl call" aria-label="Call my AI">${icon('call')}Call</button>`;
      const callControls = (connecting) =>
        `<button type="button" class="round end" aria-label="End call">${icon('end')}</button><button type="button" class="round" aria-label="Mute microphone" aria-pressed="false" ${connecting ? 'disabled' : ''}>${icon('mic')}</button>`;

      // The meta row's content: the disclaimer (or the too-long message) left, the counter right.
      const metaLine = ({ cls, disclaimer, count, tooLong }) => {
        const left = tooLong
          ? `<span class="error">${copy.tooLong}</span>`
          : `<span>${disclaimer || ''}</span>`;
        const right = count
          ? `<span class="counter${tooLong ? ' error' : ''}">${count} / 1000</span>`
          : '';
        return `<div class="meta caption ${cls}">${left}${right}</div>`;
      };

      /**
       * mode: text | call; count: the counter (null = hidden); tooLong; field options.
       * today: the line under the row in the text chat only (and for the counter in a call).
       * a:     the fixed one-line row under the row, in every mode.
       * b:     no line under the row; the counter and the too-long message above it.
       */
      const composer = ({ mode, count = null, tooLong = false, connecting = false, ...f }) => {
        const call = mode === 'call';
        const row = `<div class="composer-row">${call ? callControls(connecting) : callButton}${field(
          {
            text: call ? 'Type a message…' : '…or type instead',
            off: connecting,
            invalid: tooLong,
            ...f,
          },
        )}</div>`;
        let above = '';
        let below = '';
        if (variant === 'a') {
          const text = connecting ? copy.finePrintConnecting : copy.disclaimer;
          below = metaLine({ cls: 'fixed', disclaimer: text, count, tooLong });
        } else if (variant === 'b') {
          if (count) above = metaLine({ cls: 'above', disclaimer: null, count, tooLong });
        } else if (!call || count) {
          below = metaLine({ cls: '', disclaimer: call ? null : copy.disclaimer, count, tooLong });
        }
        return `<div class="composer">${above}${row}${below}</div>`;
      };

      // ---- The conversation ----
      const visitor = (t) => `<li class="row visitor"><div class="bubble">${t}</div></li>`;
      const assistant = (t, extra = '') =>
        `<li class="row assistant"><div class="bubble">${t}</div>${extra}</li>`;
      const chip = (t) => `<p class="chip caption">${icon('sparkle')}${t}</p>`;
      const divider = (t, call) =>
        `<li class="divider caption" role="separator"><span>${call ? icon('call') : ''}${t}</span></li>`;
      const GREETING =
        'Hi! I’m an AI assistant. Ask me about Andrew’s experience, skills and projects — I answer from this page.';
      // Variant B: the disclaimer is the greeting row's caption.
      const greeting = assistant(
        GREETING,
        variant === 'b' ? `<p class="caption greeting-note">${copy.disclaimer}</p>` : '',
      );
      const suggestions = `<li class="group"><p class="label caption">Try asking</p>${[
        'How does he build with AI agents?',
        'What impact has he had?',
        'Which apps has he shipped?',
        'Is he open to new roles?',
      ]
        .map((q) => `<button type="button" class="suggestion">${q}</button>`)
        .join('')}</li>`;
      const textLines =
        greeting +
        visitor('Is he open to new roles?') +
        assistant(
          'Yes. He’s open to senior product and Android roles, remote or B2B across the EU.',
        );
      const callLines =
        textLines +
        divider('Voice call', true) +
        visitor('What did he build at Transcenda?') +
        assistant(
          'At Transcenda Andrew shipped three apps: SpotOn, Cync and August Home, each with a million-plus users.',
          chip('Showing Transcenda'),
        );

      const textPanel = (list, comp) =>
        `<aside class="frame" aria-label="Ask about Andrew">${chatHeader}<ol class="list${list.end ? ' end' : ''}" aria-label="Conversation">${list.rows}</ol>${comp}</aside>`;
      const callPanel = (cls, header, stage, comp) =>
        `<aside class="frame ${cls}" aria-label="Voice call with Andrew’s AI">${header}<div class="stage">${stage}</div>${comp}</aside>`;

      const states = {
        empty: () => textPanel({ rows: greeting + suggestions }, composer({ mode: 'text' })),
        text: () =>
          textPanel({ rows: textLines, end: true }, composer({ mode: 'text', focus: true })),
        counter: () =>
          textPanel(
            { rows: textLines, end: true },
            composer({
              mode: 'text',
              count: 812,
              text: LONG_DRAFT,
              draft: true,
              long: true,
              focus: true,
            }),
          ),
        toolong: () =>
          textPanel(
            { rows: textLines, end: true },
            composer({
              mode: 'text',
              count: 1043,
              tooLong: true,
              text: LONG_DRAFT,
              draft: true,
              long: true,
            }),
          ),
        connecting: () =>
          callPanel(
            'connecting',
            callHeader(''),
            `${orb()}<p class="status">Connecting…</p><p class="say visitor">Allow the microphone when your browser asks.</p>${copy.privacy ? `<p class="privacy caption">${copy.privacy}</p>` : ''}`,
            composer({ mode: 'call', connecting: true }),
          ),
        call: () =>
          callPanel(
            'listening',
            callHeader(timer(42)),
            `${orb()}<p class="status">Listening</p><p class="say visitor">What did he build at Transcenda?</p>`,
            composer({ mode: 'call' }),
          ),
        callChat: () =>
          `<aside class="frame" aria-label="Voice call with Andrew’s AI">${callChatHeader}<ol class="list end" aria-label="Conversation">${callLines}</ol>${composer({ mode: 'call', focus: true })}</aside>`,
        ended: () =>
          textPanel(
            { rows: callLines + divider('Call ended · 1:24'), end: true },
            composer({ mode: 'text', focus: true }),
          ),
      };

      document.body.style.backgroundImage = `url(../voice/assets/voice_backdrop_top_${phone ? 'mobile' : 'laptop'}.png)`;
      const app = document.getElementById('app');
      app.innerHTML = (states[state] || states.text)();

      const row = app.querySelector('.composer-row');
      if (p.has('guide') && row) {
        const line = document.createElement('div');
        line.className = 'guide';
        // Anchored to the bottom like the panel (the headless window may resize after this runs).
        line.style.bottom = `${innerHeight - row.getBoundingClientRect().bottom - 1}px`;
        app.append(line);
      }
      if (p.has('measure')) {
        // Layout boxes (offsetHeight ignores the connecting orb's scale transform).
        const box = (el) => (el ? el.offsetHeight : null);
        const stage = app.querySelector('.stage');
        const frame = app.querySelector('.frame');
        document.documentElement.dataset.measure = JSON.stringify({
          variant,
          state,
          frame: box(frame),
          composer: box(app.querySelector('.composer')),
          rowBottomFromFrameBottom: Math.round(
            frame.getBoundingClientRect().bottom - row.getBoundingClientRect().bottom,
          ),
          stage: box(stage),
          stageContent: stage
            ? Math.round(
                [...stage.children].reduce((sum, el) => {
                  const cs = getComputedStyle(el);
                  return (
                    sum + el.offsetHeight + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom)
                  );
                }, 0),
              )
            : null,
          metaLines: [...app.querySelectorAll('.meta, .greeting-note')].map((el) =>
            Math.round(el.getBoundingClientRect().height / 18),
          ),
        });
      }
    </script>
  </body>
</html>
