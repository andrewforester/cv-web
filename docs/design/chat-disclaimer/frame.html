<!doctype html>
<!-- Renders mock.html in an exact-size viewport (headless Chrome has a minimum window width).
     Usage: frame.html?w=390&h=844&q=variant%3Da%26state%3Dcall -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Disclaimer mock frame</title>
    <style>
      /* Centred, so a centre crop of the window screenshot is exactly the iframe. */
      html,
      body {
        margin: 0;
        background: #fff;
      }
      body {
        display: flex;
        justify-content: center;
      }
      iframe {
        display: block;
        flex: none;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="f" title="Disclaimer mock"></iframe>
    <script>
      const p = new URLSearchParams(location.search);
      const f = document.getElementById('f');
      f.width = p.get('w') || '390';
      f.height = p.get('h') || '844';
      f.src = 'mock.html?' + (p.get('q') || '');
      // ?q=…measure: copy the mock's measurements up, so render.sh can read them with --dump-dom.
      f.addEventListener('load', () => {
        const m = f.contentDocument?.documentElement.dataset.measure;
        if (m) document.documentElement.dataset.measure = m;
      });
    </script>
  </body>
</html>
