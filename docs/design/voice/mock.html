<!doctype html>
<!--
  Static mock of the voice call panel (docs/design/voice/SPEC.md). Not product code.
  Open directly in a browser. Query params:
    state = launcher | text | connecting | listening (default) | speaking | muted | typed | tool |
            confirm | warning | chat | minimized | ended | error-denied | error-failed |
            error-busy | error-ratelimited | error-dropped | error-callcap | error-monthly | offline
  Column layout at >= 1024 px wide, phone sheet below 600 px. The page behind is a screenshot of
  production (assets/voice_backdrop_*): for the column states it was taken with the page already
  reserving the column, so the narrowed page is exact.
  Screenshots: render.sh next to this file.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice panel mock</title>
    <!-- Real tokens. The theme self-hosts Figtree / JetBrains Mono under Vite; Google Fonts here. -->
    <link rel="stylesheet" href="../../../src/theme/tokens.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block"
    />
    <style>
      /* ---- Token changes proposed in SPEC → Tokens (the build task edits tokens.css) ---- */
      :root {
        --chat-dock-width: calc(var(--chat-panel-width) + var(--space-4));
        --voice-sheet-height: calc(472px + env(safe-area-inset-bottom));
        --voice-sheet-height-short: calc(272px + env(safe-area-inset-bottom));
        --voice-orb-size: 200px;
        --voice-orb-size-small: 120px;
        --voice-orb-size-mini: var(--chat-badge-size);
        --voice-glow-pink: rgba(255, 79, 184, 0.7);
        --voice-glow-violet: rgba(139, 92, 246, 0.7);
        --voice-caption-lines: 3;
        --voice-pill-end-size: var(--chat-badge-size);
        --voice-ended-pill-duration: 4s;
        /* v2 (CV-190) */
        --chat-dock-duration: 300ms;
        --chat-dock-exit-duration: 250ms;
        --chat-motion-exit-easing: cubic-bezier(0.4, 0, 1, 1);
        --voice-chat-toggle-width: 112px;
        --voice-orb-travel-duration: 300ms;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: var(--font-sans);
        font-size: var(--chat-ui-size);
        line-height: var(--chat-ui-line-height);
        color: var(--color-ink);
        background: var(--color-page) no-repeat top center / 100% auto;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
      }
      button {
        font: inherit;
      }
      p,
      h2,
      ol {
        margin: 0;
      }

      .icon {
        display: block;
        flex: none;
        width: var(--chat-icon-size);
        height: var(--chat-icon-size);
        background: currentColor;
        mask: var(--src) center / contain no-repeat;
      }
      .i-mic {
        --src: url(../../../src/shared/chat/assets/chat_icon_mic.svg);
      }
      .i-mic-off {
        --src: url(../../../src/shared/chat/assets/chat_icon_mic_off.svg);
      }
      .i-end {
        --src: url(../../../src/shared/chat/assets/chat_icon_end.svg);
      }
      .i-offline {
        --src: url(../../../src/shared/chat/assets/chat_icon_offline.svg);
      }
      .i-alert {
        --src: url(../../../src/shared/chat/assets/chat_icon_alert.svg);
      }
      .i-timer {
        --src: url(../../../src/shared/chat/assets/chat_icon_timer.svg);
      }
      .i-chat {
        --src: url(../../../src/shared/chat/assets/chat_icon_chat.svg);
      }
      .i-sparkle {
        --src: url(../../../src/shared/chat/assets/chat_icon_sparkle.svg);
      }
      .i-close {
        --src: url(../../../src/shared/chat/assets/chat_icon_close.svg);
      }
      .i-send {
        --src: url(../../../src/shared/chat/assets/chat_icon_send.svg);
      }
      .i-call {
        --src: url(assets/voice_icon_call.svg);
      }
      .i-minimize {
        --src: url(assets/voice_icon_minimize.svg);
      }

      .caption {
        font-family: var(--font-mono);
        font-size: var(--chat-caption-size);
        line-height: var(--chat-caption-line-height);
        color: var(--chat-ink-2);
      }

      /* ---- Launcher: one pill, "Talk to my AI" ---- */
      .launcher {
        position: fixed;
        right: var(--space-4);
        bottom: var(--space-4);
        z-index: var(--chat-z-index);
        display: flex;
        align-items: center;
        gap: var(--space-3);
      }
      .pill {
        flex: none;
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--chat-launcher-padding);
        font-size: var(--type-body-size);
        line-height: var(--chat-launcher-line-height);
        font-weight: var(--type-button-weight);
        white-space: nowrap;
        color: var(--color-ink);
        background: var(--color-card);
        border: 0;
        border-radius: var(--radius-pill);
        box-shadow: var(--shadow-launcher);
      }
      .badge {
        flex: none;
        width: var(--chat-badge-size);
        height: var(--chat-badge-size);
        display: grid;
        place-items: center;
        color: var(--color-on-accent);
        background: var(--gradient-brand-tile);
        border-radius: 50%;
      }
      /* ---- The column: fixed on the right, the page reserves its width ---- */
      .column {
        position: fixed;
        top: var(--space-4);
        right: var(--space-4);
        bottom: var(--space-4);
        z-index: var(--chat-z-index);
        width: var(--chat-panel-width);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        color: var(--color-dark-ink);
        background: var(--gradient-dark);
        border: var(--border-card) solid var(--color-dark-line);
        border-radius: var(--radius-card);
        box-shadow: var(--chat-shadow-panel);
      }

      /* ChatCardHeader anatomy. */
      .header {
        flex: none;
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-3) var(--space-2) var(--space-3) var(--space-5);
        border-bottom: var(--border-card) solid var(--color-dark-line);
      }
      .titles {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: calc(var(--space-1) / 2);
      }
      .title {
        font-size: var(--chat-title-size);
        line-height: var(--chat-ui-line-height);
        font-weight: var(--type-card-title-weight);
        letter-spacing: var(--type-card-title-letter-spacing);
      }
      .sub {
        display: flex;
        align-items: center;
        gap: var(--space-1-5);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .sub b {
        font-weight: var(--type-medium-weight);
        color: var(--color-dark-ink);
      }
      .sub .live {
        color: var(--color-dark-number);
      }
      .ring {
        flex: none;
        width: var(--chat-action-icon-size);
        height: var(--chat-action-icon-size);
        transform: rotate(-90deg);
      }
      .ring .track {
        stroke: var(--color-dark-line);
      }
      .ring .done {
        stroke: var(--color-dark-ink);
        stroke-linecap: round;
      }
      .warn,
      .warn b {
        color: var(--color-dark-number);
      }
      .warn .ring .done {
        stroke: var(--color-dark-number);
      }
      .icon-btn {
        flex: none;
        width: var(--chat-control-size);
        height: var(--chat-control-size);
        display: grid;
        place-items: center;
        padding: 0;
        color: var(--color-dark-ink);
        background: transparent;
        border: 0;
        border-radius: 50%;
      }
      .icon-btn:disabled {
        color: var(--color-ink-4);
      }
      .btn-secondary {
        flex: none;
        min-height: var(--chat-secondary-button-height);
        padding: 0 var(--space-4);
        font-size: var(--chat-ui-size);
        line-height: var(--chat-ui-line-height);
        font-weight: var(--type-button-weight);
        color: var(--color-dark-ink);
        background: transparent;
        border: var(--border-card) solid var(--chat-ink-2);
        border-radius: var(--radius-pill);
        white-space: nowrap;
      }
      .btn-primary {
        color: var(--color-on-accent);
        background: var(--gradient-brand);
        border-color: transparent;
      }

      /* ---- Stage: orb, status, caption ---- */
      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--space-4) var(--space-6);
        text-align: center;
      }
      .action {
        position: absolute;
        top: var(--space-4);
        left: 50%;
        transform: translateX(-50%);
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-1) var(--space-3);
        white-space: nowrap;
        color: var(--color-dark-ink);
        border: var(--border-card) solid var(--color-dark-line);
        border-radius: var(--radius-pill);
      }
      .action .icon {
        width: var(--chat-action-icon-size);
        height: var(--chat-action-icon-size);
        color: var(--color-dark-number);
      }
      .status {
        margin-top: var(--space-3);
        font-family: var(--font-mono);
        font-size: var(--type-label-size);
        line-height: var(--chat-caption-line-height);
        letter-spacing: var(--type-label-letter-spacing);
        color: var(--color-dark-number);
      }
      /* Three lines are reserved, so the orb never moves when the caption grows. */
      .say {
        width: 100%;
        min-height: calc(var(--voice-caption-lines) * 1em * var(--type-loop-lead-line-height));
        margin-top: var(--space-3);
        font-size: var(--type-loop-lead-size);
        line-height: var(--type-loop-lead-line-height);
        letter-spacing: var(--type-loop-lead-letter-spacing);
        color: var(--color-dark-ink);
        display: -webkit-box;
        -webkit-line-clamp: var(--voice-caption-lines);
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .say.visitor {
        color: var(--chat-ink-2);
      }
      .privacy {
        margin-top: var(--space-3);
      }

      /* ---- The orb (unchanged from the full-screen design, on the dark card) ---- */
      .orb {
        --orb: var(--voice-orb-size);
        --voice-level: 0.35;
        position: relative;
        flex: none;
        width: var(--orb);
        height: var(--orb);
        margin-block: calc(var(--orb) * 0.1);
        transform: scale(calc(1 + var(--voice-level) * 0.12));
      }
      .orb .glow {
        position: absolute;
        inset: -22%;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          var(--voice-glow-pink),
          var(--voice-glow-violet) 55%,
          transparent
        );
        filter: blur(var(--space-6));
        opacity: calc(0.45 + var(--voice-level) * 0.5);
        animation: breathe var(--voice-breathe) ease-in-out infinite alternate;
      }
      .orb .body {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 50%;
        box-shadow: var(--voice-orb-shadow);
        background: radial-gradient(
          circle at 50% 60%,
          var(--color-brand-violet),
          var(--color-accent)
        );
      }
      .orb .swirl {
        position: absolute;
        inset: -30%;
        background: var(--voice-orb-gradient);
        filter: blur(var(--voice-orb-blur));
        animation: spin var(--voice-spin-listening) linear infinite;
      }
      .orb .shimmer {
        position: absolute;
        inset: -20%;
        background: conic-gradient(
          from 90deg,
          transparent,
          rgba(255, 255, 255, 0.6) 10%,
          transparent 26%,
          transparent 50%,
          rgba(255, 255, 255, 0.45) 62%,
          transparent 78%
        );
        filter: blur(var(--space-4));
        mix-blend-mode: soft-light;
        animation: spin calc(var(--voice-spin-listening) * 0.6) linear infinite reverse;
      }
      .orb .shade {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background:
          radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.75), transparent 38%),
          radial-gradient(circle at 50% 120%, rgba(42, 31, 61, 0.35), transparent 60%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
      }
      .speaking .orb {
        transform: scale(calc(1 + var(--voice-level) * 0.2));
      }
      .speaking .orb .swirl {
        animation-duration: var(--voice-spin-speaking);
      }
      .speaking .orb .shimmer {
        animation-duration: calc(var(--voice-spin-speaking) * 0.6);
      }
      .speaking .orb .glow {
        inset: -32%;
      }
      .connecting .orb {
        transform: scale(0.82);
      }
      .connecting .orb .body,
      .muted .orb .body {
        filter: saturate(0.45);
        opacity: 0.85;
      }
      .connecting .orb .glow,
      .muted .orb .glow {
        opacity: 0.35;
      }
      /* Small orb: confirm and error cards, the phone sheet. */
      .confirm .orb,
      .error .orb {
        --orb: var(--voice-orb-size-small);
      }
      .error .orb {
        filter: grayscale(1);
        opacity: 0.35;
        transform: none;
      }
      .error .orb .swirl,
      .error .orb .shimmer,
      .error .orb .glow {
        animation: none;
      }
      .error .orb .glow {
        display: none;
      }
      /* Mini orb: the chat header's badge slot and the pill. No glow at 36 px (it would smear). */
      .orb.mini {
        --orb: var(--voice-orb-size-mini);
        margin: 0;
        transform: scale(calc(1 + var(--voice-level) * 0.08));
      }
      .orb.mini .glow {
        display: none;
      }
      .orb.mini .swirl {
        filter: blur(calc(var(--voice-orb-blur) / 3));
      }
      .orb.mini .shimmer {
        filter: blur(var(--space-1));
      }
      .orb.mini .body {
        box-shadow: none;
      }

      /* ---- Cards in the stage (confirm, error): the chat's ConfirmationCard frame ---- */
      .card {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        margin-top: var(--space-4);
        padding: var(--space-3) var(--space-4);
        text-align: left;
        background: var(--chat-notice-bg);
        border: var(--border-card) solid var(--color-dark-line);
        border-radius: var(--radius-tile);
      }
      .card.err {
        background: var(--chat-fill);
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: var(--space-3);
      }
      .glyph {
        flex: none;
        width: var(--chat-badge-size);
        height: var(--chat-badge-size);
        display: grid;
        place-items: center;
        color: var(--color-dark-number);
        background: var(--chat-notice-bg);
        border-radius: 50%;
      }
      .card-title {
        font-size: var(--chat-text-size);
        line-height: var(--chat-text-line-height);
        font-weight: var(--type-card-title-weight);
      }
      .card-body {
        color: var(--chat-ink-2);
      }
      .card-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        margin-top: var(--space-1);
      }

      /* ---- Call controls: 56 high, the composer field's height ---- */
      .round,
      .ctl {
        flex: none;
        height: var(--voice-control-size);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        padding: 0;
        font-size: var(--type-button-size);
        font-weight: var(--type-button-weight);
        white-space: nowrap;
        color: var(--color-dark-ink);
        background: var(--chat-fill);
        border: var(--border-card) solid var(--color-dark-line);
        border-radius: var(--radius-pill);
      }
      .round {
        width: var(--voice-control-size);
      }
      .ctl {
        padding: 0 var(--space-5) 0 var(--space-4);
      }
      .round .icon,
      .ctl .icon {
        width: var(--voice-control-icon-size);
        height: var(--voice-control-icon-size);
      }
      .round[aria-pressed='true'] {
        color: var(--color-dark-number);
        background: var(--chat-notice-bg);
        border-color: var(--color-dark-number);
      }
      .round:disabled {
        color: var(--color-ink-4);
        background: transparent;
      }
      /* End: the one white control on the dark card. */
      .round.end {
        color: var(--color-ink);
        background: var(--color-card);
        border-color: transparent;
      }
      /* Call: the composer's primary action while no call runs (ConfirmationCard's Confirm look). */
      .ctl.call {
        color: var(--color-on-accent);
        background: var(--gradient-brand);
        border-color: transparent;
      }
      /* Show chat / Hide chat: one toggle, same place in both views, fixed width. */
      .toggle {
        min-width: var(--voice-chat-toggle-width);
      }

      /* ---- The chat in the column (during and after the call) ---- */
      .list {
        flex: 1;
        min-height: 0;
        margin: 0;
        padding: var(--space-4) var(--space-5);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: var(--space-3);
        overflow: hidden;
        list-style: none;
      }
      .row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-1);
      }
      .row.visitor {
        align-items: flex-end;
      }
      .bubble {
        max-width: 100%;
        font-size: var(--chat-text-size);
        line-height: var(--chat-text-line-height);
        border-radius: var(--radius-tile);
      }
      .visitor .bubble {
        max-width: var(--chat-bubble-max-width);
        padding: var(--space-3) var(--space-4);
        color: var(--color-ink);
        background: var(--color-surface-lilac);
        border-bottom-right-radius: var(--chat-radius-tail);
      }
      .assistant .bubble {
        padding: var(--space-3) calc(var(--space-4) - var(--border-card));
        border: var(--border-card) solid var(--color-dark-line);
        border-bottom-left-radius: var(--chat-radius-tail);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-1) var(--space-3);
        color: var(--color-dark-ink);
        border: var(--border-card) solid var(--color-dark-line);
        border-radius: var(--radius-pill);
      }
      .chip .icon {
        width: var(--chat-action-icon-size);
        height: var(--chat-action-icon-size);
        color: var(--color-dark-number);
      }
      .divider {
        display: flex;
        align-items: center;
        gap: var(--space-3);
      }
      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        border-top: var(--border-card) solid var(--color-dark-line);
      }
      .divider span {
        display: inline-flex;
        align-items: center;
        gap: var(--space-1-5);
      }
      .divider .icon {
        width: var(--chat-action-icon-size);
        height: var(--chat-action-icon-size);
        color: var(--color-dark-number);
      }
      /* The composer: [Call] or [End][Mute] left of the field; the same row in both call views. */
      .composer {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        padding: var(--space-3) var(--space-5) var(--space-4);
        border-top: var(--border-card) solid var(--color-dark-line);
      }
      .composer-row {
        display: flex;
        align-items: flex-end;
        gap: var(--space-2);
      }
      .field {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: flex-end;
        gap: var(--space-2);
        padding: 5px 5px 5px 15px;
        background: var(--chat-fill);
        border: var(--border-card) solid var(--color-ink-4);
        border-radius: var(--radius-card);
      }
      .field.focus {
        border-color: var(--color-dark-number);
        box-shadow: 0 0 0 var(--border-card) var(--color-dark-number);
      }
      .field span {
        flex: 1;
        min-width: 0;
        padding: 11px 0;
        font-size: var(--chat-text-size);
        line-height: var(--chat-text-line-height);
        color: var(--chat-ink-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .field span.draft {
        color: var(--color-dark-ink);
      }
      .field.off {
        opacity: 0.5;
      }
      .send {
        flex: none;
        width: var(--chat-control-size);
        height: var(--chat-control-size);
        display: grid;
        place-items: center;
        color: var(--color-ink-4);
        background: var(--chat-fill-hover);
        border: 0;
        border-radius: 50%;
      }
      .send.on {
        color: var(--color-on-accent);
        background: var(--gradient-brand-tile);
      }

      /* ---- Minimized: the call pill in the launcher's place ---- */
      .callpill {
        position: fixed;
        right: var(--space-4);
        bottom: var(--space-4);
        z-index: var(--chat-z-index);
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-1-5);
        background: var(--color-card);
        border-radius: var(--radius-pill);
        box-shadow: var(--shadow-launcher);
      }
      .callpill .expand {
        display: flex;
        align-items: center;
        gap: var(--space-2-5);
        padding: 0 var(--space-1) 0 0;
        color: var(--color-ink);
        background: transparent;
        border: 0;
        border-radius: var(--radius-pill);
      }
      .callpill .state {
        font-size: var(--type-body-size);
        line-height: var(--chat-launcher-line-height);
        font-weight: var(--type-button-weight);
      }
      .callpill .time {
        font-family: var(--font-mono);
        font-size: var(--type-meta-size);
        color: var(--color-ink-3);
        font-variant-numeric: tabular-nums;
      }
      .callpill .hang {
        width: var(--voice-pill-end-size);
        height: var(--voice-pill-end-size);
        display: grid;
        place-items: center;
        padding: 0;
        color: var(--color-on-accent);
        background: var(--color-ink);
        border: 0;
        border-radius: 50%;
      }

      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }
      @keyframes breathe {
        to {
          transform: scale(1.06);
        }
      }

      /* ---- Phone (<= 599 px): the call is a bottom sheet, the chat a full-screen sheet ---- */
      @media (max-width: 599px), (max-height: 499px) {
        :root {
          --voice-orb-size: var(--voice-orb-size-small);
          --voice-caption-lines: 2;
        }
        .column {
          top: auto;
          left: 0;
          right: 0;
          bottom: 0;
          width: auto;
          height: var(--voice-sheet-height);
          border-bottom: 0;
          border-radius: var(--radius-card) var(--radius-card) 0 0;
        }
        .column.chat-view {
          top: 0;
          height: auto;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
        .header {
          padding-left: var(--space-4);
        }
        .stage {
          padding-inline: var(--space-4);
        }
        .action {
          top: var(--space-2);
        }
        .list,
        .composer {
          padding-inline: var(--space-4);
        }
        .composer {
          padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const p = new URLSearchParams(location.search);
      const state = p.get('state') || 'listening';
      const phone = matchMedia('(max-width: 599px), (max-height: 499px)').matches;
      const form = phone ? 'mobile' : 'desktop';

      const icon = (name) => `<span class="icon i-${name}" aria-hidden="true"></span>`;
      const ring = (sec) => {
        const c = 2 * Math.PI * 5.5;
        const done = ((sec / 180) * c).toFixed(1);
        return `<svg class="ring" viewBox="0 0 14 14" aria-hidden="true"><circle class="track" cx="7" cy="7" r="5.5" fill="none" stroke-width="2"/><circle class="done" cx="7" cy="7" r="5.5" fill="none" stroke-width="2" stroke-dasharray="${done} ${c}"/></svg>`;
      };
      const orb = (mini) =>
        `<div class="orb${mini ? ' mini' : ''}" aria-hidden="true"><div class="glow"></div><div class="body"><div class="swirl"></div><div class="shimmer"></div></div><div class="shade"></div></div>`;
      const timer = (sec, warn) =>
        warn
          ? `<p class="sub caption warn" role="timer">${ring(sec)}<b>0:${String(180 - sec).padStart(2, '0')}</b> left</p>`
          : `<p class="sub caption" role="timer">${ring(sec)}<b>${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}</b> / 3:00</p>`;

      const minimizeBtn = `<button type="button" class="icon-btn" aria-label="Minimize call" aria-expanded="true">${icon('minimize')}</button>`;
      const closeBtn = `<button type="button" class="icon-btn" aria-label="Close voice chat">${icon('close')}</button>`;
      const minimizeOff = minimizeBtn.replace(
        'aria-expanded="true"',
        'aria-expanded="true" disabled',
      );
      // Show chat / Hide chat: one toggle, the same place in both views (left of minimize).
      const toggle = (open) =>
        `<button type="button" class="btn-secondary toggle">${open ? 'Hide chat' : 'Show chat'}</button>`;
      const callHeader = (sub, actions = toggle(false) + minimizeBtn) =>
        `<header class="header"><span class="badge" aria-hidden="true">${icon('sparkle')}</span><div class="titles"><h2 class="title">Voice call</h2>${sub}</div>${actions}</header>`;

      // The composer row. Text: [Call] + field. Call (both views): [End][Mute] + field, no disclaimer.
      const field = ({
        text = 'Type a message…',
        draft = false,
        focus = false,
        off = false,
      } = {}) =>
        `<div class="field${focus ? ' focus' : ''}${off ? ' off' : ''}"><span${draft ? ' class="draft"' : ''}>${text}</span><button type="button" class="send${draft ? ' on' : ''}" aria-label="Send" ${draft ? '' : 'disabled'}>${icon('send')}</button></div>`;
      const callBar = ({ muted = false, connecting = false, ...f } = {}) =>
        `<div class="composer"><div class="composer-row">
          <button type="button" class="round end" aria-label="End call">${icon('end')}</button>
          <button type="button" class="round" aria-label="${muted ? 'Unmute microphone' : 'Mute microphone'}" aria-pressed="${muted}" ${connecting ? 'disabled' : ''}>${icon(muted ? 'mic-off' : 'mic')}</button>
          ${field({ off: connecting, ...f })}
        </div></div>`;
      const textComposer = `<div class="composer"><div class="composer-row"><button type="button" class="ctl call" aria-label="Call my AI">${icon('call')}Call</button>${field({ text: '…or type instead' })}</div><p class="caption">Answers are AI-generated and may contain mistakes.</p></div>`;

      const panel = (cls, header, stage, bottom = callBar()) =>
        `<aside class="column ${cls}" aria-label="Voice call with Andrew’s AI">${header}<div class="stage">${stage}</div>${bottom}</aside>`;

      const errorCard = (glyph, title, body, primary, secondary) =>
        `<div class="card err" role="alert"><div class="card-head"><span class="glyph">${icon(glyph)}</span><p class="card-title">${title}</p></div><p class="card-body">${body}</p><div class="card-buttons"><button type="button" class="btn-secondary btn-primary">${primary}</button><button type="button" class="btn-secondary">${secondary}</button></div></div>`;
      const errorPanel = (...card) =>
        panel('error', callHeader('', closeBtn), `${orb()}${errorCard(...card)}`, '');

      // The conversation: a text exchange before the call, then the call's lines (one history).
      const visitor = (t) => `<li class="row visitor"><div class="bubble">${t}</div></li>`;
      const assistant = (t, extra = '') =>
        `<li class="row assistant"><div class="bubble">${t}</div>${extra}</li>`;
      const chip = (t) => `<p class="chip caption">${icon('sparkle')}${t}</p>`;
      const divider = (t, mic) =>
        `<li class="divider caption" role="separator"><span>${mic ? icon('call') : ''}${t}</span></li>`;
      const textLines =
        visitor('Is he open to new roles?') +
        assistant(
          'Yes. He’s open to senior product and Android roles, remote or B2B across the EU.',
        );
      const callLines =
        textLines +
        divider('Voice call', true) +
        visitor('What did he build at Transcenda?') +
        assistant(
          'At Transcenda Andrew shipped three apps: SpotOn, Cync and August Home, each with a million-plus users.',
          chip('Showing Transcenda'),
        ) +
        visitor('Which one was the hardest?') +
        assistant('SpotOn: a point-of-sale and kiosk app with strict offline rules.');
      // A typed line during the call: an ordinary visitor row of the call.
      const typedLine = visitor('Does he use Kotlin Multiplatform?');

      const chatHeader = `<header class="header"><span class="badge" aria-hidden="true">${icon('sparkle')}</span><div class="titles"><h2 class="title">Ask about Andrew</h2><p class="caption">AI assistant · answers from this page</p></div>${closeBtn.replace('Close voice chat', 'Close chat')}</header>`;

      const states = {
        text: () =>
          `<aside class="column chat-view" aria-label="Ask about Andrew">${chatHeader}<ol class="list" aria-label="Conversation">${textLines}</ol>${textComposer}</aside>`,
        connecting: () =>
          panel(
            'connecting',
            callHeader('', toggle(false) + minimizeOff),
            `${orb()}<p class="status">Connecting…</p><p class="say visitor">Allow the microphone when your browser asks.</p><p class="privacy caption">Calls run on ElevenLabs. Voice and text share one history. AI can make mistakes.</p>`,
            callBar({ connecting: true }),
          ),
        listening: () =>
          panel(
            'listening',
            callHeader(timer(42)),
            `${orb()}<p class="status">Listening</p><p class="say visitor">What did he build at Transcenda?</p>`,
          ),
        speaking: () =>
          panel(
            'speaking',
            callHeader(timer(51)),
            `${orb()}<p class="status">Speaking</p><p class="say">At Transcenda Andrew shipped three apps: SpotOn, Cync and August Home, each with a million-plus users.</p>`,
          ),
        muted: () =>
          panel(
            'muted',
            callHeader(timer(64)),
            `${orb()}<p class="status">Mic off</p><p class="say visitor">Your microphone is off. Unmute to talk.</p>`,
            callBar({ muted: true }),
          ),
        typed: () =>
          panel(
            'listening',
            callHeader(timer(97)),
            `${orb()}<p class="status">Listening</p><p class="say visitor">Does he use Kotlin Multiplatform?</p>`,
            callBar({ text: 'And Compose?', draft: true, focus: true }),
          ),
        tool: () =>
          panel(
            'speaking tool',
            callHeader(timer(55)),
            `<p class="action caption" role="status">${icon('sparkle')}Showing Transcenda</p>${orb()}<p class="status">Speaking</p><p class="say">Here’s his Transcenda work: three apps, each with a million-plus users.</p>`,
          ),
        confirm: () =>
          panel(
            'speaking confirm',
            callHeader(timer(118)),
            `${orb()}<div class="card" role="group" aria-label="Open a WhatsApp chat with Andrew?"><p class="card-title">Open a WhatsApp chat with Andrew?</p><p class="caption">wa.me/48519457129</p><div class="card-buttons"><button type="button" class="btn-secondary btn-primary">Open WhatsApp</button><button type="button" class="btn-secondary">Cancel</button></div><p class="caption">Your browser needs a tap to open it.</p></div>`,
          ),
        warning: () =>
          panel(
            'speaking',
            callHeader(timer(156, true)),
            `${orb()}<p class="status">Speaking</p><p class="say">He’s open to new roles, remote or B2B across the EU. Want me to open his email?</p>`,
          ),
        chat: () =>
          `<aside class="column chat-view speaking" aria-label="Voice call with Andrew’s AI">
            <header class="header">${orb(true)}<div class="titles"><h2 class="title">Voice call</h2><p class="sub caption"><span class="live">Speaking</span> · <b>1:12</b></p></div>${toggle(true)}${minimizeBtn}</header>
            <ol class="list" aria-label="Conversation">${callLines}${typedLine}${assistant('Yes: he shipped a shared Kotlin Multiplatform core for the August Home apps.')}</ol>
            ${callBar({ focus: true })}
          </aside>`,
        ended: () =>
          `<aside class="column chat-view" aria-label="Ask about Andrew">${chatHeader}<ol class="list" aria-label="Conversation">${callLines}${divider('Call ended · 1:24')}</ol>${textComposer}</aside>`,
        minimized: () =>
          `<div class="callpill listening" role="group" aria-label="Voice call"><button type="button" class="expand" aria-label="Open the call panel" aria-expanded="false">${orb(true)}<span class="state">Listening</span><span class="time">0:42</span></button><button type="button" class="hang" aria-label="End call">${icon('end')}</button></div>`,
        launcher: () =>
          `<div class="launcher"><button type="button" class="pill"><span class="badge" aria-hidden="true">${icon('sparkle')}</span>Talk to my AI</button></div>`,
        'error-denied': () =>
          errorPanel(
            'mic-off',
            'Microphone is blocked',
            'Allow the microphone for this site in your browser’s address bar, then try again. Or type your question.',
            'Try again',
            'Type instead',
          ),
        'error-failed': () =>
          errorPanel(
            'alert',
            'Couldn’t start the call',
            'The voice service didn’t answer. Try again in a moment, or type your question.',
            'Try again',
            'Type instead',
          ),
        'error-busy': () =>
          errorPanel(
            'alert',
            'The line is busy',
            'Someone else is talking to the AI right now. Try again in a few minutes, or type your question.',
            'Try again',
            'Type instead',
          ),
        'error-ratelimited': () =>
          errorPanel(
            'timer',
            'Too many calls',
            'You’ve started several calls in a short time. Try again in a minute, or type your question.',
            'Try again',
            'Type instead',
          ),
        'error-dropped': () =>
          errorPanel(
            'alert',
            'The call dropped',
            'The connection was lost. Everything said so far is in the chat.',
            'Call again',
            'Open chat',
          ),
        'error-callcap': () =>
          errorPanel(
            'timer',
            'That’s the 3-minute limit',
            'Calls are capped at 3 minutes. Everything said is in the chat.',
            'Call again',
            'Open chat',
          ),
        'error-monthly': () =>
          errorPanel(
            'timer',
            'Voice is resting this month',
            'This month’s voice time is used up. The text chat still works.',
            'Type instead',
            'Close',
          ),
        offline: () =>
          errorPanel(
            'offline',
            'You’re offline',
            'Connect to the internet to talk to the AI.',
            'Try again',
            'Close',
          ),
      };

      // The page behind: the column states sit over a page that already reserves the column.
      const fullWidth = ['launcher', 'minimized'].includes(state);
      const backdrop = phone
        ? state === 'tool'
          ? 'tool_mobile'
          : 'top_mobile'
        : fullWidth
          ? 'top_desktop'
          : state === 'tool'
            ? 'column-tool_desktop'
            : 'column_desktop';
      document.body.style.backgroundImage = `url(assets/voice_backdrop_${backdrop}.png)`;
      document.getElementById('app').innerHTML = (states[state] || states.listening)();
      document.documentElement.dataset.form = form;
    </script>
  </body>
</html>
