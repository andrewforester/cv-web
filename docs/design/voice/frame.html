<!doctype html>
<!-- Renders mock.html in an exact-size viewport (headless Chrome has a minimum window width).
     Usage: frame.html?w=390&h=844&q=state%3Dlistening -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Voice mock frame</title>
    <style>
      /* Centred, so a centre crop of the window screenshot is exactly the iframe. */
      html,
      body {
        margin: 0;
        background: #fff;
      }
      body {
        display: flex;
        justify-content: center;
      }
      iframe {
        display: block;
        flex: none;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="f" title="Voice mock"></iframe>
    <script>
      const p = new URLSearchParams(location.search);
      const f = document.getElementById('f');
      f.width = p.get('w') || '390';
      f.height = p.get('h') || '844';
      f.src = 'mock.html?' + (p.get('q') || '');
    </script>
  </body>
</html>
