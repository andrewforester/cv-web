<!doctype html>
<!--
  Static mock of the AI chat in the Forest look (docs/design/forest-chat/SPEC.md). Not product code.
  Open directly in a browser. Query params:
    state = launcher | empty | typing | streaming (default) | errors | notices | actions | offline
    lang  = en (default) | uk
  Desktop layout at >= 600 px wide (and >= 500 px tall), full-screen sheet below that.
  The backdrop is the Forest /new render (../forest/screenshot*.png), not live markup.
  Screenshots: render.sh next to this file.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forest chat mock</title>
    <!-- Base tokens (--space-*, --chat-* sizes and motion). The Forest tokens are copied below
         with the names of the Forest theme task; the fonts come from Google Fonts for standalone
         viewing (the app self-hosts them via @fontsource). -->
    <link rel="stylesheet" href="../../../src/theme/tokens.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=block"
    />
    <style>
      /* ---- Forest tokens (docs/design/forest/SPEC.md; names as in src/theme/tokens.css) ---- */
      :root {
        --forest-bg: #ffffff;
        --forest-ink: #15211a;
        --forest-ink-3: #7f8a78;
        --forest-accent: #3e7a34;
        --forest-gold: #c49a34;
        --forest-gold-soft: #e3c46a;
        --forest-dark-ink: #eef2e8;
        --forest-dark-ink-2: #a8b4a0;
        --forest-dark-line: #3a4d3f;
        --forest-gradient-text: linear-gradient(90deg, #4e9a36, #c49a34);
        --forest-gradient-hero: linear-gradient(135deg, #1f3a22, #3e7a34);
        --forest-gradient-dark: linear-gradient(150deg, #1a2b1e 0%, #0e120f 40%, #0a0b0a 100%);
        --forest-radius-panel: 24px;
        --forest-radius-step: 16px;
        --forest-radius-pill: 999px;
        --forest-font-display: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --forest-font-text: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --forest-font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        --forest-type-skills-title-size: 16px;
        --forest-type-skills-title-weight: 600;
      }

      /* ---- New tokens proposed in SPEC → New tokens (Theme adds them to tokens.css) ---- */
      :root {
        --forest-chat-fill: rgba(238, 242, 232, 0.06);
        --forest-chat-fill-hover: rgba(238, 242, 232, 0.12);
        --forest-chat-error: #f08a80;
        --forest-chat-error-bg: rgba(240, 138, 128, 0.12);
        --forest-chat-notice-bg: rgba(227, 196, 106, 0.12);
        --forest-chat-shadow-fab: 0 12px 28px -12px rgba(62, 122, 52, 0.6), 0 2px 6px rgba(10, 11, 10, 0.3);
        --forest-chat-shadow-panel: 0 30px 80px -40px rgba(62, 122, 52, 0.5), 0 16px 40px -12px rgba(10, 11, 10, 0.35);
        --forest-chat-text-size: 15px;
        --forest-chat-text-line-height: 22px;
        --forest-chat-ui-size: 14px;
        --forest-chat-ui-line-height: 20px;
        --forest-chat-caption-size: 11.5px;
        --forest-chat-caption-line-height: 16px;
      }

      /* ---- global.css equivalent ---- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--forest-bg);
        color: var(--forest-ink);
        font-family: var(--forest-font-display);
        -webkit-font-smoothing: antialiased;
      }
      h2,
      p {
        margin: 0;
      }
      button,
      textarea {
        font: inherit;
        color: inherit;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      svg {
        display: block;
      }

      /* ---- Backdrop: the Forest /new render ---- */
      .backdrop img {
        display: block;
        width: 100%;
      }

      /* ---- Focus rings: accent on the light page, gold-soft on the dark chat ---- */
      .chat :focus-visible {
        outline: 2px solid var(--forest-gold-soft);
        outline-offset: 2px;
      }
      .launcher :focus-visible {
        outline-color: var(--forest-accent);
      }

      /* ---- Launcher (FAB + first-visit hint) ---- */
      .launcher {
        position: fixed;
        right: var(--space-6);
        bottom: var(--space-6);
        z-index: var(--chat-z-index);
        display: flex;
        align-items: center;
        gap: var(--space-3);
      }
      .fab {
        position: relative;
        width: var(--chat-fab-size);
        height: var(--chat-fab-size);
        flex: none;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 50%;
        color: var(--forest-dark-ink);
        background: var(--forest-gradient-dark);
        box-shadow: var(--forest-chat-shadow-fab);
        cursor: pointer;
      }
      .fab:hover {
        background: var(--forest-gradient-hero);
      }
      .fab svg {
        width: var(--chat-fab-icon-size);
        height: var(--chat-fab-icon-size);
      }
      /* AI ring: the green→gold text gradient, 2 px, 4 px outside the button. */
      .fab::before {
        content: '';
        position: absolute;
        inset: calc(-1 * var(--space-1));
        padding: 2px;
        border-radius: 50%;
        background: var(--forest-gradient-text);
        pointer-events: none;
        mask:
          linear-gradient(#000 0 0) content-box exclude,
          linear-gradient(#000 0 0);
      }
      .launcher .fab:focus-visible {
        outline-offset: 6px;
      }
      .hint {
        display: flex;
        align-items: flex-start;
        gap: var(--space-1);
        max-width: var(--chat-hint-max-width);
        padding: var(--space-3) var(--space-2) var(--space-3) var(--space-4);
        font-size: var(--forest-chat-ui-size);
        line-height: var(--forest-chat-ui-line-height);
        color: var(--forest-dark-ink);
        background: var(--forest-gradient-dark);
        border: 1px solid var(--forest-dark-line);
        border-radius: var(--forest-radius-step);
        box-shadow: var(--forest-chat-shadow-panel);
      }
      .hint .icon-btn {
        width: 24px;
        height: 24px;
        margin-top: -2px;
      }
      .hint .icon-btn svg {
        width: 16px;
        height: 16px;
      }
      .hint .icon-btn:focus-visible {
        outline-color: var(--forest-gold-soft);
      }

      /* ---- Panel ---- */
      .panel {
        position: fixed;
        right: var(--space-6);
        bottom: var(--space-6);
        z-index: var(--chat-z-index);
        width: var(--chat-panel-width);
        height: min(var(--chat-panel-height), calc(100dvh - 2 * var(--space-6)));
        display: flex;
        flex-direction: column;
        overflow: hidden;
        color: var(--forest-dark-ink);
        background: var(--forest-gradient-dark);
        border: 1px solid var(--forest-dark-line);
        border-radius: var(--forest-radius-panel);
        box-shadow: var(--forest-chat-shadow-panel);
      }
      .header {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-3) var(--space-2) var(--space-3) var(--space-5);
        border-bottom: 1px solid var(--forest-dark-line);
      }
      .badge {
        flex: none;
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--forest-gradient-text);
        color: var(--forest-ink);
      }
      .badge svg {
        width: var(--chat-icon-size);
        height: var(--chat-icon-size);
      }
      .titles {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .title {
        font-size: var(--forest-type-skills-title-size);
        line-height: var(--forest-chat-ui-line-height);
        font-weight: var(--forest-type-skills-title-weight);
        letter-spacing: -0.015em;
      }
      .caption,
      .subtitle {
        font-family: var(--forest-font-mono);
        font-size: var(--forest-chat-caption-size);
        line-height: var(--forest-chat-caption-line-height);
        color: var(--forest-dark-ink-2);
      }
      .icon-btn {
        flex: none;
        width: var(--chat-control-size);
        height: var(--chat-control-size);
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--forest-dark-ink);
        cursor: pointer;
      }
      .icon-btn:hover {
        background: var(--forest-chat-fill-hover);
      }
      .icon-btn svg {
        width: var(--chat-icon-size);
        height: var(--chat-icon-size);
      }

      .notice {
        padding: var(--space-2) var(--space-5);
        font-size: var(--forest-chat-ui-size);
        line-height: var(--forest-chat-ui-line-height);
        background: var(--forest-chat-notice-bg);
        border-bottom: 1px solid var(--forest-gold-soft);
      }

      .list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-color: var(--forest-dark-line) transparent;
        scrollbar-width: thin;
        margin: 0;
        padding: var(--space-4) var(--space-5);
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      .row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-1);
      }
      .row.visitor {
        align-items: flex-end;
      }
      .bubble {
        max-width: 100%;
        font-family: var(--forest-font-text);
        font-size: var(--forest-chat-text-size);
        line-height: var(--forest-chat-text-line-height);
        border-radius: var(--forest-radius-step);
        overflow-wrap: anywhere;
      }
      .visitor .bubble {
        max-width: var(--chat-bubble-max-width);
        padding: var(--space-3) var(--space-4);
        white-space: pre-wrap;
        color: var(--forest-bg);
        background: var(--forest-gradient-hero);
        border-bottom-right-radius: var(--chat-radius-tail);
      }
      .assistant .bubble {
        padding: var(--space-3) 15px;
        border: 1px solid var(--forest-dark-line);
        border-bottom-left-radius: var(--chat-radius-tail);
      }
      .assistant .bubble.error {
        background: var(--forest-chat-error-bg);
        border-color: var(--forest-chat-error);
      }
      .bubble p + p,
      .bubble p + ul,
      .bubble ul + p {
        margin-top: var(--space-2);
      }
      .bubble ul {
        margin: 0;
        padding-left: var(--space-5);
        list-style: none;
      }
      /* Bullets: the Forest "—" in accent, here gold-soft on dark. */
      .bubble li {
        position: relative;
      }
      .bubble li::before {
        content: '—';
        position: absolute;
        left: calc(-1 * var(--space-5));
        color: var(--forest-gold-soft);
      }
      .bubble li + li {
        margin-top: var(--space-1);
      }
      .bubble strong {
        font-weight: 500;
        color: var(--forest-dark-ink);
      }
      .caret {
        display: inline-block;
        width: 2px;
        height: 18px;
        margin-left: 2px;
        vertical-align: -3px;
        background: var(--forest-gold-soft);
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .typing {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        height: var(--forest-chat-text-line-height);
      }
      .typing i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--forest-gold-soft);
        animation: dot 1.2s infinite both;
      }
      .typing i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing i:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes dot {
        0%,
        80%,
        100% {
          opacity: 0.3;
        }
        40% {
          opacity: 1;
        }
      }

      /* Secondary (Try again, Start a new chat, Cancel) and primary (Confirm) pill buttons. */
      .btn {
        min-height: var(--space-8);
        padding: 0 var(--space-4);
        font-family: var(--forest-font-display);
        font-size: var(--forest-chat-ui-size);
        line-height: var(--forest-chat-ui-line-height);
        font-weight: 600;
        color: var(--forest-dark-ink);
        background: transparent;
        border: 1px solid var(--forest-dark-ink-2);
        border-radius: var(--forest-radius-pill);
        cursor: pointer;
      }
      .btn:hover {
        background: var(--forest-chat-fill-hover);
      }
      .btn.primary {
        color: var(--forest-ink);
        background: var(--forest-gold-soft);
        border-color: var(--forest-gold-soft);
      }
      .btn.primary:hover {
        background: var(--forest-gold);
        border-color: var(--forest-gold);
      }
      .bubble .btn {
        display: block;
        margin-top: var(--space-2);
      }

      /* Suggested questions and commands */
      .groups {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      .suggest {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-2);
      }
      .suggest .label {
        margin-top: var(--space-1);
        font-family: var(--forest-font-mono);
        font-size: var(--forest-chat-caption-size);
        line-height: var(--forest-chat-caption-line-height);
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--forest-gold-soft);
      }
      .chip {
        max-width: 100%;
        min-height: var(--space-8);
        padding: var(--space-2) var(--space-4);
        text-align: left;
        font-family: var(--forest-font-display);
        font-size: var(--forest-chat-ui-size);
        line-height: var(--forest-chat-ui-line-height);
        color: var(--forest-dark-ink);
        background: var(--forest-chat-fill);
        border: 1px solid var(--forest-dark-line);
        border-radius: var(--forest-radius-step);
        cursor: pointer;
      }
      .chip:hover {
        background: var(--forest-chat-fill-hover);
        border-color: var(--forest-gold-soft);
      }

      /* Page actions: status chips and the confirmation card */
      .actions {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-2);
      }
      .action {
        max-width: 100%;
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-1) var(--space-3);
        font-family: var(--forest-font-mono);
        font-size: var(--forest-chat-caption-size);
        line-height: var(--forest-chat-caption-line-height);
        color: var(--forest-dark-ink);
        border: 1px solid var(--forest-dark-line);
        border-radius: var(--forest-radius-pill);
        overflow-wrap: anywhere;
      }
      .action svg {
        flex: none;
        width: 14px;
        height: 14px;
        color: var(--forest-gold-soft);
      }
      .action.running {
        color: var(--forest-dark-ink-2);
      }
      .action.running svg {
        animation: dot 1.2s infinite both;
      }
      .action.failed {
        color: var(--forest-chat-error);
        background: var(--forest-chat-error-bg);
        border-color: var(--forest-chat-error);
      }
      .action.failed svg {
        color: currentColor;
      }
      .confirm {
        max-width: 100%;
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        padding: var(--space-3) var(--space-4);
        background: var(--forest-chat-notice-bg);
        border: 1px solid var(--forest-dark-line);
        border-radius: var(--forest-radius-step);
      }
      .confirm .confirm-title {
        font-size: var(--forest-chat-text-size);
        line-height: var(--forest-chat-text-line-height);
        font-weight: 600;
      }
      .confirm .buttons {
        display: flex;
        gap: var(--space-2);
        margin-top: var(--space-1);
      }

      /* Composer */
      .composer {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        padding: var(--space-3) var(--space-5) var(--space-4);
        border-top: 1px solid var(--forest-dark-line);
      }
      .field {
        display: flex;
        align-items: flex-end;
        gap: var(--space-2);
        padding: 5px 5px 5px 15px;
        border: 1px solid var(--forest-ink-3);
        border-radius: var(--forest-radius-panel);
        background: var(--forest-chat-fill);
      }
      .field:focus-within {
        border-color: var(--forest-gold-soft);
        box-shadow: 0 0 0 1px var(--forest-gold-soft);
      }
      .field.invalid {
        border-color: var(--forest-chat-error);
        box-shadow: 0 0 0 1px var(--forest-chat-error);
      }
      .field textarea {
        flex: 1;
        min-width: 0;
        min-height: var(--chat-control-size);
        max-height: calc(6 * var(--forest-chat-text-line-height));
        padding: 11px 0;
        border: 0;
        outline: none;
        resize: none;
        background: transparent;
        font-family: var(--forest-font-text);
        font-size: var(--forest-chat-text-size);
        line-height: var(--forest-chat-text-line-height);
        color: var(--forest-dark-ink);
        scrollbar-color: var(--forest-dark-line) transparent;
      }
      .field textarea::placeholder {
        color: var(--forest-dark-ink-2);
        opacity: 1;
      }
      .send {
        flex: none;
        width: var(--chat-control-size);
        height: var(--chat-control-size);
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 50%;
        color: var(--forest-ink);
        background: var(--forest-gold-soft);
        cursor: pointer;
      }
      .send:hover {
        background: var(--forest-gold);
      }
      .send svg {
        width: var(--chat-icon-size);
        height: var(--chat-icon-size);
      }
      .send:disabled {
        color: var(--forest-ink-3);
        background: var(--forest-chat-fill-hover);
        cursor: default;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        gap: var(--space-3);
      }
      .meta .error {
        color: var(--forest-chat-error);
      }
      .meta .counter {
        flex: none;
        white-space: nowrap;
      }

      /* ---- Mobile: full-screen sheet ---- */
      .backdrop .mobile {
        display: none;
      }
      @media (max-width: 599px), (max-height: 499px) {
        .backdrop .desktop {
          display: none;
        }
        .backdrop .mobile {
          display: block;
        }
        .launcher {
          right: var(--space-4);
          bottom: var(--space-4);
        }
        .panel {
          inset: 0;
          width: 100%;
          height: 100dvh;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
        .header {
          padding-top: calc(var(--space-3) + env(safe-area-inset-top));
          padding-left: var(--space-4);
        }
        .notice {
          padding-inline: var(--space-4);
        }
        .list {
          padding-inline: var(--space-4);
        }
        .composer {
          padding-inline: var(--space-4);
          padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .caret,
        .typing i,
        .action.running svg {
          animation: none;
        }
        .typing i {
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true">
      <img class="desktop" src="../forest/screenshot.png" alt="" />
      <img class="mobile" src="../forest/screenshot-mobile.png" alt="" />
    </div>

    <div class="chat" id="chat"></div>

    <script>
      const params = new URLSearchParams(location.search);
      const state = params.get('state') || 'streaming';
      const lang = params.get('lang') === 'uk' ? 'uk' : 'en';
      document.documentElement.lang = lang;

      // Strings: identical to src/screens/chat/strings.ts (docs/design/chat/SPEC.md → Texts, O1–O4).
      const S = {
        en: {
          fabLabel: 'Open chat with the AI assistant',
          hint: 'Questions about Andrew’s experience? Ask the AI assistant.',
          hintDismiss: 'Dismiss',
          title: 'Ask about Andrew',
          subtitle: 'AI assistant · answers from this CV',
          close: 'Close chat',
          listLabel: 'Conversation',
          you: 'You:',
          assistant: 'Assistant:',
          greeting:
            'Hi! I’m an AI assistant. Ask me about Andrew’s experience, skills and projects — I answer from his CV.',
          tryAsking: 'Try asking',
          chips: [
            'What is his experience with Android?',
            'Which AI tools does he use?',
            'Which apps has he worked on?',
            'Has he led a team?',
          ],
          commandsLabel: 'Or ask me to do something on the page',
          commands: [
            'Show me his Kotlin experience',
            'Switch the page to Ukrainian',
            'Scroll to the apps',
          ],
          inputLabel: 'Your question',
          placeholder: 'Ask a question…',
          send: 'Send',
          stop: 'Stop answer',
          disclaimer: 'Answers are AI-generated and may contain mistakes.',
          error: 'Sorry, I couldn’t answer. Please try again.',
          retry: 'Try again',
          rateLimited: 'I’m getting a lot of questions right now. Please try again in a minute.',
          conversationLimit:
            'This chat has reached its length limit. Start a new chat to ask more.',
          newChat: 'Start a new chat',
          stopped: 'Answer stopped.',
          offline: 'You’re offline. Connect to the internet to ask a question.',
          tooLong: 'Shorten your question to 1000 characters or fewer.',
          scrolledApps: 'Scrolled to Apps',
          showingKotlin: 'Showing Kotlin…',
          unavailable: 'That isn’t available on this page.',
          confirmEmail: 'Write an email to Andrew?',
          confirm: 'Confirm',
          cancel: 'Cancel',
          appsAnswer: 'Here are his three apps: Cync, August Home, Savant.',
          askGithub: 'Open his GitHub',
          askEmail: 'Can I email him?',
        },
        uk: {
          fabLabel: 'Відкрити чат із ШІ-асистентом',
          hint: 'Маєте питання про досвід Андрія? Запитайте ШІ-асистента.',
          hintDismiss: 'Закрити підказку',
          title: 'Запитайте про Андрія',
          subtitle: 'ШІ-асистент · відповідає за резюме',
          close: 'Закрити чат',
          listLabel: 'Розмова',
          you: 'Ви:',
          assistant: 'Асистент:',
          greeting:
            'Привіт! Я ШІ-асистент. Запитайте мене про досвід, навички та проєкти Андрія — я відповідаю на основі його резюме.',
          tryAsking: 'Спробуйте запитати',
          chips: [
            'Який у нього досвід з Android?',
            'Якими ШІ-інструментами він користується?',
            'Над якими застосунками він працював?',
            'Чи керував він командою?',
          ],
          commandsLabel: 'Або попросіть щось зробити на сторінці',
          commands: [
            'Покажи його досвід з Kotlin',
            'Перемкни сторінку на англійську',
            'Прокрути до застосунків',
          ],
          inputLabel: 'Ваше запитання',
          placeholder: 'Поставте запитання…',
          send: 'Надіслати',
          stop: 'Зупинити відповідь',
          disclaimer: 'Відповіді генерує ШІ, тож можливі помилки.',
          error: 'Вибачте, не вдалося відповісти. Спробуйте ще раз.',
          retry: 'Спробувати ще раз',
          rateLimited: 'Зараз надходить забагато запитань. Спробуйте ще раз за хвилину.',
          conversationLimit: 'Розмова досягла ліміту довжини. Почніть новий чат, щоб запитати ще.',
          newChat: 'Почати новий чат',
          stopped: 'Відповідь зупинено.',
          offline: 'Немає з’єднання з інтернетом. Підключіться, щоб поставити запитання.',
          tooLong: 'Скоротіть запитання до 1000 символів.',
          scrolledApps: 'Прокручено: Застосунки',
          showingKotlin: 'Показую: Kotlin…',
          unavailable: 'Це недоступно на цій сторінці.',
          confirmEmail: 'Написати Андрієві листа?',
          confirm: 'Підтвердити',
          cancel: 'Скасувати',
          appsAnswer: 'Ось його три застосунки: Cync, August Home, Savant.',
          askGithub: 'Відкрий його GitHub',
          askEmail: 'Можна йому написати?',
        },
      }[lang];

      const icon = {
        chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-7l-4.5 3.5V17H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/><path d="M12 7.25l.95 2.3 2.3.95-2.3.95-.95 2.3-.95-2.3-2.3-.95 2.3-.95z" fill="currentColor" stroke-width="1"/></svg>',
        sparkle:
          '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 3.5l1.9 4.6 4.6 1.9-4.6 1.9L10 16.5l-1.9-4.6L3.5 10l4.6-1.9z"/><path d="M17.5 13.5l.95 2.05 2.05.95-2.05.95-.95 2.05-.95-2.05-2.05-.95 2.05-.95z"/></svg>',
        close:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
        send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
        stop: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
      };

      // Sample conversation (EN content; answers are model output, so they stay as written).
      const Q1 = 'What is his experience with Android?';
      const A1 = `<p>Andrew has built Android apps <strong>since 2012</strong> — 12+ years in total.</p>
        <ul>
          <li><strong>Transcenda</strong> (2021–2026): Senior Android Developer on the Cync and August Home smart-home apps, each with 1M+ users.</li>
          <li>Jetpack Compose with custom Canvas graphics, BLE device discovery and sync.</li>
          <li>Earlier: WiseHouse, Attendify, Smartling (SDK), RosFines (Android lead), Samsung.</li>
        </ul>`;
      const Q2 = 'Which AI tools does he use?';
      const A2partial = `<p>He builds LLM features on the <strong>Claude API</strong> and runs agentic development with <strong>Claude Code</strong>: an orchestrator in Linear and up to three parallel sessions, with CI as the<span class="caret" aria-hidden="true"></span></p>`;

      const visitor = (text) =>
        `<li class="row visitor"><div class="bubble"><span class="sr-only">${S.you} </span>${text}</div></li>`;
      const assistant = (html, cls = '', extra = '', footer = '') =>
        `<li class="row assistant"><div class="bubble ${cls}"><span class="sr-only">${S.assistant} </span>${html}${extra}</div>${footer}</li>`;
      const greeting = assistant(`<p>${S.greeting}</p>`);
      const btn = (label, cls = '') => `<button type="button" class="btn ${cls}">${label}</button>`;
      const action = (text, cls) =>
        `<p class="action ${cls}">${icon.sparkle}<span>${text}</span></p>`;

      const launcher = (withHint) => `
        <div class="launcher">
          ${withHint ? `<div class="hint" role="note"><span>${S.hint}</span><button type="button" class="icon-btn" aria-label="${S.hintDismiss}">${icon.close}</button></div>` : ''}
          <button type="button" class="fab" aria-label="${S.fabLabel}" aria-haspopup="dialog" aria-expanded="false" aria-controls="chat-panel">${icon.chat}</button>
        </div>`;

      function panel({
        messages,
        notice = '',
        value = '',
        streaming = false,
        invalid = false,
        count = '',
      }) {
        const canSend = value && !invalid && !notice;
        return `
        <section class="panel" id="chat-panel" role="dialog" aria-modal="true" aria-labelledby="chat-title" aria-describedby="chat-subtitle">
          <header class="header">
            <span class="badge" aria-hidden="true">${icon.sparkle}</span>
            <div class="titles">
              <h2 class="title" id="chat-title">${S.title}</h2>
              <p class="subtitle" id="chat-subtitle">${S.subtitle}</p>
            </div>
            <button type="button" class="icon-btn" aria-label="${S.close}">${icon.close}</button>
          </header>
          ${notice ? `<p class="notice" role="status">${notice}</p>` : ''}
          <ol class="list" tabindex="0" aria-label="${S.listLabel}">${messages}</ol>
          <div class="sr-only" aria-live="polite"></div>
          <form class="composer" onsubmit="return false">
            <div class="field ${invalid ? 'invalid' : ''}">
              <textarea rows="1" aria-label="${S.inputLabel}" placeholder="${S.placeholder}" enterkeyhint="send"
                ${invalid ? 'aria-invalid="true" aria-describedby="chat-meta"' : ''}>${value}</textarea>
              ${
                streaming
                  ? `<button type="button" class="send" aria-label="${S.stop}">${icon.stop}</button>`
                  : `<button type="submit" class="send" aria-label="${S.send}" ${canSend ? '' : 'disabled'}>${icon.send}</button>`
              }
            </div>
            <div class="meta caption" id="chat-meta">
              ${invalid ? `<span class="error">${S.tooLong}</span><span class="error counter">${count}</span>` : `<span>${S.disclaimer}</span>${count ? `<span class="counter">${count}</span>` : ''}`}
            </div>
          </form>
        </section>`;
      }

      const group = (id, label, items) =>
        `<div class="suggest" role="group" aria-labelledby="${id}"><p class="label" id="${id}">${label}</p>${items
          .map((c) => `<button type="button" class="chip">${c}</button>`)
          .join('')}</div>`;
      const suggestions = `<li class="groups">${group('chat-try', S.tryAsking, S.chips)}${group('chat-cmd', S.commandsLabel, S.commands)}</li>`;

      const longText =
        'Could you tell me in detail about every project he did with Bluetooth Low Energy, which devices were involved, how offline mode worked, what the sync protocol looked like, how he tested it, which libraries he chose and why, how the team was organised, what his exact responsibilities were compared to the other Android developers, and whether he would be open to a similar role in a hardware company that builds smart locks and cameras for the European market? Also, what was the hardest bug he fixed there, how long did it take, who helped, what would he do differently today, which metrics improved after the fix, how did the users notice it, and did the company write anything about it publicly? Please also list every tool, every library and every service the team used, with versions, and explain for each one why it was picked over the alternatives, what problems it caused and how they were solved. And finally, which of those choices would he keep for a new project starting next month, and why?';

      const views = {
        launcher: () => launcher(true),
        empty: () => panel({ messages: greeting + suggestions }),
        typing: () =>
          panel({
            messages:
              greeting +
              visitor(S.commands[0]) +
              `<li class="actions">${action(S.showingKotlin, 'running')}</li>` +
              assistant(`<span class="typing" aria-hidden="true"><i></i><i></i><i></i></span>`),
            streaming: true,
          }),
        streaming: () =>
          panel({
            messages: greeting + visitor(Q1) + assistant(A1) + visitor(Q2) + assistant(A2partial),
            streaming: true,
          }),
        errors: () =>
          panel({
            messages:
              greeting +
              visitor(Q1) +
              assistant(
                `<p>He has built Android apps since 2012, most recently at Transcenda on</p>`,
                '',
                '',
                `<p class="caption">${S.stopped}</p>`,
              ) +
              visitor(Q2) +
              assistant(`<p>${S.error}</p>`, 'error', btn(S.retry)),
          }),
        notices: () =>
          panel({
            messages:
              greeting +
              visitor(S.chips[3]) +
              assistant(`<p>${S.rateLimited}</p>`) +
              visitor(S.chips[2]) +
              assistant(`<p>${S.conversationLimit}</p>`, '', btn(S.newChat)),
          }),
        actions: () =>
          panel({
            messages:
              visitor(S.commands[2]) +
              `<li class="actions">${action(S.scrolledApps, 'done')}</li>` +
              assistant(`<p>${S.appsAnswer}</p>`) +
              visitor(S.askGithub) +
              `<li class="actions">${action(S.unavailable, 'failed')}</li>` +
              visitor(S.askEmail) +
              `<li class="actions"><div class="confirm" role="group" aria-label="${S.confirmEmail}"><p class="confirm-title">${S.confirmEmail}</p><p class="caption">andriipanasiuk@gmail.com</p><div class="buttons">${btn(S.confirm, 'primary')}${btn(S.cancel)}</div></div></li>`,
            streaming: true,
          }),
        offline: () =>
          panel({
            messages: greeting + visitor(Q1) + assistant(A1),
            notice: S.offline,
            value: longText,
            invalid: true,
            count: `${longText.length} / 1000`,
          }),
      };
      document.getElementById('chat').innerHTML = (views[state] || views.streaming)();
      // Auto-grow the input and keep the list pinned to the latest message (after fonts load).
      function layout() {
        const ta = document.querySelector('textarea');
        if (ta) {
          ta.style.height = 'auto';
          ta.style.height = ta.scrollHeight + 'px';
        }
        const list = document.querySelector('.list');
        if (list && state !== 'empty') list.scrollTop = list.scrollHeight;
      }
      layout();
      document.fonts.ready.then(layout);
      addEventListener('load', layout);
    </script>
  </body>
</html>
