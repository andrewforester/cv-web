<!doctype html>
<!--
  Static mock of the Retro Rebuild show (docs/design/retro/SPEC.md). Not product code.
  It follows docs/retro/ARCHITECTURE.md: the page is today's CV (same element types and hooks as
  src/screens/cv: data-testid, data-agent-id) styled by the real src/theme/tokens.css; the 2002 look
  is the damage layers in layers/*.css, injected as <link data-retro-layer> at the end of <head>,
  plus show-owned decorations in a portal. A fix step removes layers and decorations.
  Round 4 (GRA-54): the dock is a light Chrome DevTools panel (Console tab, console commands, live
  error/warning counters) docked right, and the agent chat is a floating card in the site's AI-chat
  look; the highlight is Chrome's Elements-tab box model with the plate in the bottom-left corner.
  The console text is generated from the layer files, so open it over http or with render.sh:
    python3 -m http.server  (repo root)  →  http://localhost:8000/docs/design/retro/mock.html
  Query params:
    state = broken (default) | chat | console | step1-mid | step1 | colours-mid | step2-mid | step2 |
            rest-mid | finale | closing | end
    dock  = 0   hide the chat/console dock (full-page renders)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Andrew Panasiuk - Homepage</title>
    <!-- Real tokens. Inter from Google Fonts for standalone viewing. -->
    <link rel="stylesheet" href="../../../src/theme/tokens.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&display=block"
    />
    <style>
      /* ---- Round-4 tokens (SPEC → Tokens): proposed values, not yet in src/theme/tokens.css.
              Declared here so the mock renders before the theme task (R15) lands. ---- */
      :root {
        /* Dock: DevTools column + floating agent chat */
        --retro-dock-width: 400px;
        --retro-dock-inset: 16px;
        --retro-chat-height: 392px;
        /* DevTools panel (Chrome light theme) */
        --devtools-bg: #ffffff;
        --devtools-toolbar-bg: #f3f6fc;
        --devtools-input-bg: #e9eef6;
        --devtools-divider: #dadce0;
        --devtools-row-divider: #f1f3f4;
        --devtools-text: #1f1f1f;
        --devtools-text-dim: #5f6368;
        --devtools-accent: #0b57d0;
        --devtools-error: #dc362e;
        --devtools-warning: #f29900;
        --devtools-warning-bg: #fef7e0;
        --devtools-warning-text: #5c3c00;
        --devtools-warning-border: #fdeeb5;
        --devtools-success: #188038;
        --devtools-code-keyword: #aa0d91;
        --devtools-code-string: #c41a16;
        --devtools-code-number: #1c00cf;
        --devtools-code-comment: #236e25;
        --devtools-node-tag: #881280;
        --devtools-node-class: #1a1aa6;
        --devtools-ui-font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --devtools-ui-font-size: 12px;
        --devtools-code-font: Menlo, Consolas, 'DejaVu Sans Mono', monospace;
        --devtools-code-font-size: 11px;
        --devtools-code-line-height: 16px;
        --devtools-plate-shadow: 0 1px 4px rgba(0, 0, 0, 0.24);
        /* Highlight: Chrome's box model, lighter */
        --retro-highlight-content: rgba(111, 168, 220, 0.35);
        --retro-highlight-content-flash: rgba(111, 168, 220, 0.6);
        --retro-highlight-padding: rgba(147, 196, 125, 0.3);
        --retro-highlight-border: rgba(255, 229, 153, 0.4);
        --retro-highlight-margin: rgba(246, 178, 107, 0.3);
        --retro-highlight-page: rgba(111, 168, 220, 0.2);
        --retro-highlight-flash: 100ms;
        /* End of the show */
        --retro-close-slide: 300ms;
        --retro-close-shrink: 500ms;
        --retro-close-stagger: 150ms;
      }

      /* =====================================================================================
         TODAY'S SITE: approximation of src/theme/global.css, src/app and src/screens/cv modules.
         Classes stand in for CSS Module classes; layers never select them.
         ===================================================================================== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--font-family);
        font-size: var(--font-body-size);
        line-height: var(--font-body-line-height);
        font-weight: var(--font-body-weight);
        letter-spacing: var(--letter-spacing);
        color: var(--color-text);
        background: var(--color-bg);
      }
      h1,
      h2,
      h3,
      p,
      figure {
        margin: 0;
      }
      h1,
      h2,
      h3 {
        font-size: inherit;
        font-weight: inherit;
      }
      .shell {
        max-width: calc(var(--content-max-width) + 2 * var(--page-gutter));
        margin: 0 auto;
        padding: var(--space-4) var(--page-gutter) calc(var(--chat-fab-size) + 2 * var(--space-6));
      }
      .app-header {
        display: flex;
        justify-content: flex-end;
        margin-bottom: var(--space-8);
      }
      .switcher {
        display: inline-flex;
        gap: var(--space-1);
      }
      .switcher button {
        padding: var(--space-1) var(--space-3);
        font: inherit;
        font-size: var(--font-meta-size);
        color: var(--color-text);
        background: var(--color-bg);
        border: var(--border-card) solid var(--color-card-border);
        border-radius: var(--radius-logo);
      }
      .switcher button[aria-pressed='true'] {
        color: var(--color-bg);
        background: var(--color-text);
        border-color: var(--color-text);
      }
      /* HeaderSection */
      .hdr {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas: 'intro photo' 'intro contacts';
        column-gap: var(--space-4);
        row-gap: var(--space-4);
      }
      .intro {
        grid-area: intro;
      }
      .name {
        margin-top: var(--space-1);
        font-size: var(--font-name-size);
        line-height: var(--font-name-line-height);
        font-weight: var(--font-name-weight);
      }
      .tagline {
        margin-top: var(--space-5);
        font-style: italic;
      }
      .photo {
        grid-area: photo;
        justify-self: end;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
      }
      /* ContactList */
      .contacts {
        grid-area: contacts;
        justify-self: end;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: var(--space-2);
        font-style: normal;
      }
      .row {
        display: flex;
        align-items: center;
        gap: var(--space-1);
      }
      .row a {
        display: inline-flex;
      }
      .icon {
        width: 18px;
        height: 18px;
      }
      .link {
        margin-left: var(--space-1);
        color: inherit;
        text-decoration: none;
      }
      /* SectionTitle */
      .title {
        margin: var(--space-8) 0 var(--space-3);
        font-size: var(--font-section-size);
        line-height: var(--font-section-line-height);
        font-weight: var(--font-section-weight);
      }
      .title.first {
        margin-top: var(--space-7);
      }
      .medium {
        font-weight: 500;
      }
      .bi {
        font-weight: 700;
        font-style: italic;
      }
      /* TechnologiesSection, TechnologyCardView */
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        column-gap: var(--space-7);
        align-items: start;
      }
      .column {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: var(--space-3) 15px;
        background: var(--color-bg);
        border: var(--border-card) solid var(--color-card-border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-card);
      }
      .card-title {
        font-size: var(--font-card-title-size);
        line-height: var(--font-card-title-line-height);
        font-weight: var(--font-card-title-weight);
      }
      .card-body {
        font-size: var(--font-card-body-size);
        line-height: var(--font-card-body-line-height);
      }
      .card.hl {
        border-color: var(--color-highlight);
      }
      .star {
        position: absolute;
        top: 0;
        right: 0;
        width: 18px;
        height: 18px;
        transform: translate(50%, -50%);
      }
      .card.ai {
        border-color: transparent;
      }
      .card.ai::before {
        content: '';
        position: absolute;
        inset: -1px;
        padding: 1.5px;
        border-radius: inherit;
        background: var(--gradient-ai);
        mask:
          linear-gradient(#000 0 0) content-box exclude,
          linear-gradient(#000 0 0);
      }
      /* ExperienceList, ExperienceEntry */
      .xp-list {
        display: flex;
        flex-direction: column;
        gap: var(--space-7);
      }
      .head {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        grid-template-areas: 'logo company period' 'logo role role';
        column-gap: var(--space-3);
        row-gap: var(--space-1);
        align-items: start;
      }
      .logo {
        grid-area: logo;
        width: 36px;
        height: 36px;
        border-radius: var(--radius-logo);
        object-fit: contain;
        background: var(--color-bg);
      }
      .company {
        grid-area: company;
        font-size: var(--font-subsection-size);
        line-height: var(--font-subsection-line-height);
        font-weight: var(--font-subsection-weight);
      }
      .remote {
        position: relative;
        top: -8px;
        margin-left: 6px;
        font-size: var(--font-tag-size);
        line-height: var(--font-tag-line-height);
        font-weight: 400;
        font-style: italic;
        color: var(--color-text-muted);
      }
      .role {
        grid-area: role;
        line-height: var(--font-body-size);
        color: var(--color-text-secondary);
      }
      .period {
        grid-area: period;
        font-size: var(--font-meta-size);
        line-height: var(--font-meta-line-height);
        color: var(--color-text-secondary);
      }
      .bullets {
        margin-top: 9px;
      }
      /* AppsSection, AppCardView, AppStat */
      .apps {
        display: flex;
        gap: var(--space-4);
      }
      .app {
        flex: 1 1 auto;
        padding: 15px;
        background: var(--color-bg);
        border: 0.75px solid var(--color-app-border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-card);
        letter-spacing: var(--letter-spacing-app);
        color: var(--color-app-text);
      }
      .app-name {
        font-size: var(--font-app-name-size);
        line-height: var(--font-app-name-line-height);
        font-weight: var(--font-app-name-weight);
      }
      .app-pub {
        margin-top: var(--space-1);
        font-size: var(--font-app-publisher-size);
        line-height: var(--font-app-publisher-line-height);
        font-weight: 500;
        color: var(--color-app-accent);
      }
      .app-stats {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        margin-top: var(--space-2);
      }
      .app-icon {
        flex: none;
        width: 36px;
        height: 36px;
        border-radius: var(--radius-logo);
      }
      .stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-1);
        white-space: nowrap;
      }
      .stat-value {
        display: inline-flex;
        align-items: center;
        font-size: var(--font-app-value-size);
        line-height: var(--font-app-value-line-height);
        font-weight: 500;
      }
      .stat-value img {
        width: 15px;
        height: 15px;
      }
      .stat-label {
        font-size: var(--font-app-label-size);
        line-height: var(--font-app-label-line-height);
        color: var(--color-app-muted);
      }
      .divider {
        flex: none;
        width: 0.75px;
        height: 27px;
        background: color-mix(in srgb, var(--color-app-muted) 40%, transparent);
      }
      /* EducationSection, AboutSection, BookView */
      .edu {
        font-size: var(--font-education-size);
        line-height: var(--font-education-line-height);
      }
      .subtitle {
        margin-bottom: var(--space-3);
        font-size: var(--font-subsection-size);
        line-height: var(--font-subsection-line-height);
        font-weight: var(--font-subsection-weight);
      }
      .books {
        display: flex;
        column-gap: 37px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .cover {
        display: block;
        width: 100px;
        height: 150px;
        object-fit: cover;
        box-shadow: var(--shadow-book);
      }
      .book-cap {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-top: var(--space-3);
      }
      .book-title {
        font-size: var(--font-book-title-size);
        line-height: var(--font-book-title-line-height);
      }
      .book-author {
        font-size: var(--font-book-author-size);
        line-height: var(--font-book-author-line-height);
      }
      .interests-title {
        margin-top: var(--space-7);
      }
      .interests {
        font-size: var(--font-meta-size);
        line-height: var(--font-meta-line-height);
      }
      /* =====================================================================================
         SHOW: stage reserve for the dock, decorations (show-owned DOM in a portal).
         ===================================================================================== */
      body.docked {
        padding-right: var(--retro-dock-width);
      }
      .deco {
        position: absolute;
        z-index: 1;
        letter-spacing: normal;
      }
      /* Highlight of the chunk's target (SPEC → Highlight): Chrome's Elements-tab box model,
         lighter. Each match: margin (orange) ⊃ border (yellow) ⊃ padding (green) ⊃ content (blue). */
      .bm {
        position: absolute;
        z-index: 2;
        pointer-events: none;
      }
      .bm > i {
        position: absolute;
        display: block;
      }
      .bm .m {
        background: var(--retro-highlight-margin);
      }
      .bm .b {
        background: var(--retro-highlight-border);
      }
      .bm .p {
        background: var(--retro-highlight-padding);
      }
      .bm .c {
        background: var(--retro-highlight-content);
      }
      .bm.applied .c {
        background: var(--retro-highlight-content-flash);
      }
      .bm-page {
        position: fixed;
        z-index: 2;
        inset: 0;
        background: var(--retro-highlight-page);
        pointer-events: none;
      }
      body.docked .bm-page {
        right: var(--retro-dock-width);
      }
      .bm-page.applied {
        background: var(--retro-highlight-content);
      }
      /* The plate: bottom-left corner of the page area, as Chrome's Elements-tab tooltip. */
      .plate {
        position: fixed;
        z-index: 3;
        left: 0;
        bottom: 0;
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 4px 8px;
        background: var(--devtools-bg);
        box-shadow: var(--devtools-plate-shadow);
        font: var(--devtools-ui-font-size) / 16px var(--devtools-ui-font);
        letter-spacing: normal;
        white-space: nowrap;
        pointer-events: none;
      }
      .plate .tag {
        color: var(--devtools-node-tag);
      }
      .plate .cls {
        color: var(--devtools-node-class);
      }
      .plate .size {
        color: var(--devtools-text-dim);
        font-variant-numeric: tabular-nums;
      }
      @keyframes retro-blink {
        50% {
          visibility: hidden;
        }
      }
      #top-bar {
        font:
          11px/14px Verdana,
          Geneva,
          sans-serif;
      }
      #top-bar nav {
        margin-bottom: 8px;
        padding: 3px;
        text-align: center;
        background: #000080;
      }
      #top-bar nav span {
        display: inline-block;
        margin: 1px;
        padding: 2px 10px;
        font-weight: 700;
        color: #000000;
        background: #c0c0c0;
        border: 2px outset #ffffff;
        text-decoration: underline;
      }
      #top-bar .marquee {
        overflow: hidden;
        border: 1px solid #ff0000;
        background: #000000;
        color: #ffff00;
        font:
          bold 13px/20px 'Comic Sans MS',
          'Comic Neue',
          cursive;
        white-space: nowrap;
      }
      #top-bar .marquee span {
        display: inline-block;
        padding-left: 100%;
        animation: marquee 18s linear infinite;
      }
      @keyframes marquee {
        to {
          transform: translateX(-100%);
        }
      }
      #page-footer {
        padding-top: 8px;
        border-top: 2px groove #c0c0c0;
        text-align: center;
        font:
          11px/16px Verdana,
          Geneva,
          sans-serif;
        color: #000000;
      }
      #page-footer p {
        margin: 4px 0;
      }
      #page-footer u {
        color: #0000ee;
      }
      .counter {
        display: inline-flex;
        gap: 1px;
        padding: 2px;
        background: #404040;
        vertical-align: middle;
      }
      .counter span {
        width: 12px;
        font:
          bold 14px/18px 'Courier New',
          monospace;
        color: #33ff33;
        background: #000000;
        text-align: center;
      }
      #page-footer .badges img {
        margin: 0 3px;
        vertical-align: middle;
      }
      #oh-snap {
        width: 184px;
        padding: 10px 12px;
        background: #ffff99;
        border: 1px solid #cc9900;
        box-shadow: 3px 3px 0 #000000;
        font:
          13px/17px 'Comic Sans MS',
          'Comic Neue',
          cursive;
        color: #000000;
        transform: rotate(2.5deg);
      }
      #oh-snap strong {
        display: block;
        font-size: 18px;
        line-height: 24px;
        color: #cc0000;
      }
      /* =====================================================================================
         DOCK (round 4): Chrome DevTools docked right (Console tab) + the agent chat as a
         floating card in the site's AI-chat look. Values: SPEC → Screen layout, DevTools console,
         Agent chat panel. The dock root re-declares the site's tokens with their live values
         (set by the script), so damage token layers on :root never restyle the panels.
         ===================================================================================== */
      .dock {
        display: none;
        letter-spacing: normal;
      }
      body.docked .dock {
        display: block;
      }
      .ic {
        flex: none;
        display: inline-block;
        width: 16px;
        height: 16px;
        background: currentColor;
        mask: var(--icon) center / contain no-repeat;
      }
      .devtools {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 1001;
        display: flex;
        flex-direction: column;
        width: var(--retro-dock-width);
        background: var(--devtools-bg);
        border-left: 1px solid var(--devtools-divider);
        font: var(--devtools-ui-font-size) / 16px var(--devtools-ui-font);
        color: var(--devtools-text);
      }
      .dt-bar {
        flex: none;
        display: flex;
        align-items: stretch;
        height: 28px;
        border-bottom: 1px solid var(--devtools-divider);
        white-space: nowrap;
      }
      .dt-tabs {
        padding-left: 2px;
        background: var(--devtools-toolbar-bg);
      }
      .dt-btn {
        flex: none;
        display: grid;
        place-items: center;
        width: 28px;
        color: var(--devtools-text-dim);
      }
      .dt-sep {
        flex: none;
        width: 1px;
        margin: 6px 2px;
        background: var(--devtools-divider);
      }
      .dt-tab {
        position: relative;
        display: flex;
        align-items: center;
        padding: 0 7px;
        color: var(--devtools-text-dim);
      }
      .dt-tab.active {
        color: var(--devtools-accent);
      }
      .dt-tab.active::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background: var(--devtools-accent);
      }
      .dt-grow {
        flex: 1;
        min-width: 0;
      }
      .dt-badges {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 4px;
        font-variant-numeric: tabular-nums;
      }
      .dt-badge {
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .dt-badge .err {
        color: var(--devtools-error);
      }
      .dt-badge .warn {
        color: var(--devtools-warning);
      }
      .dt-badge.zero .ic {
        color: var(--devtools-text-dim);
      }
      .dt-filter {
        gap: 2px;
        padding: 0 4px 0 0;
      }
      .dt-select {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 4px 0 6px;
        color: var(--devtools-text);
      }
      .dt-select .ic {
        width: 12px;
        height: 12px;
        color: var(--devtools-text-dim);
      }
      .dt-field {
        flex: 1;
        min-width: 0;
        align-self: center;
        height: 20px;
        margin: 0 4px;
        padding: 0 8px;
        border-radius: 10px;
        background: var(--devtools-input-bg);
        color: var(--devtools-text-dim);
        line-height: 20px;
      }
      /* Console messages: top-anchored, they follow the last row; the bottom padding keeps the
         rows above the floating chat card. */
      .dt-console {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        padding-bottom: calc(var(--retro-chat-height) + 2 * var(--retro-dock-inset));
        font: var(--devtools-code-font-size) / var(--devtools-code-line-height)
          var(--devtools-code-font);
      }
      .cr {
        position: relative;
        min-height: 21px;
        padding: 2px 8px 2px 24px;
        border-bottom: 1px solid var(--devtools-row-divider);
        white-space: pre-wrap;
        word-break: break-all;
      }
      .cr > .ic {
        position: absolute;
        left: 4px;
        top: 2px;
      }
      .cr.input > .ic,
      .cr.prompt > .ic {
        color: var(--devtools-accent);
      }
      .cr.result,
      .cr.result > .ic,
      .cr.group > .ic {
        color: var(--devtools-text-dim);
      }
      .cr.group {
        font-weight: 700;
      }
      .cr.group.closed > .ic {
        transform: rotate(-90deg);
      }
      .cr.warn {
        margin-top: -1px;
        background: var(--devtools-warning-bg);
        border-top: 1px solid var(--devtools-warning-border);

        color: var(--devtools-warning);
      }

        border-bottom: 0;
      }
      .cr.end {
        font-weight: 700;
      }
      .k {
        color: var(--devtools-code-keyword);
      }
      .s {
        color: var(--devtools-code-string);
      }
      .n {
        color: var(--devtools-code-number);
      }
      .cm {
        color: var(--devtools-code-comment);
      }
      .ok {
        color: var(--devtools-success);
      }

        display: inline-block;
        width: 1px;
        height: 14px;
        margin-bottom: -3px;
        background: var(--devtools-text);
        animation: caret-blink 1s steps(1) infinite;
      }
      @keyframes caret-blink {
        50% {
          visibility: hidden;
        }
      }

        position: fixed;
        right: var(--retro-dock-inset);
        bottom: var(--retro-dock-inset);
        z-index: 1002;
        display: flex;
        flex-direction: column;
        width: calc(var(--retro-dock-width) - 2 * var(--retro-dock-inset));
        height: var(--retro-chat-height);
        overflow: hidden;
        background: var(--color-bg);
        border-radius: var(--radius-card);
        box-shadow: var(--chat-shadow-panel);
        font-family: var(--font-family);
        font-size: var(--font-body-size);
        line-height: var(--font-body-line-height);
        letter-spacing: var(--letter-spacing);
        color: var(--color-text);
      }

        content: '';
        position: absolute;
        inset: 0;
        padding: 1.5px;
        border-radius: inherit;
        background: var(--gradient-ai);
        mask:

          linear-gradient(#000 0 0);
        pointer-events: none;

        height: 69px;
      }

        display: flex;
        align-items: center;

        color: var(--color-text);

        align-self: flex-start;

        border-bottom-left-radius: var(--chat-radius-tail);
      }
      .ac-msg.visitor {
        align-self: flex-end;
        max-width: var(--chat-bubble-max-width);
        padding: var(--space-3) var(--space-4);
        background: var(--color-text);
        color: var(--color-bg);
        border-bottom-right-radius: var(--chat-radius-tail);

      .stream-caret {

        width: 2px;
        height: 18px;
        margin: 0 0 -3px 2px;
        background: currentColor;
      }
      .ac-composer {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        padding: var(--space-3) var(--space-4);
        border-top: 1px solid var(--chat-color-divider);
      }
      .ac-field {
        display: flex;
        align-items: flex-end;
        gap: var(--space-2);
        padding: 5px 5px 5px 15px;
        border: 1px solid var(--color-text-muted);
        border-radius: var(--radius-card);
      }
      .ac-field.focus {
        border-color: var(--color-text);
        box-shadow: 0 0 0 1px var(--color-text);
      }
      .ac-input {
        flex: 1;
        min-width: 0;

        white-space: nowrap;
        overflow: hidden;

      }
      .ac-input .ph {

      }
      .ac-send {
        flex: none;
        display: grid;
        place-items: center;
        width: var(--chat-control-size);
        height: var(--chat-control-size);
        border-radius: 50%;
        background: var(--color-text);
        color: var(--color-bg);

      /* ---- After the show: the site's AI chat launcher (approximation of ChatLauncher) ---- */

        right: var(--space-6);
        bottom: var(--space-6);
        z-index: 1000;
        display: none;
        place-items: center;
        width: var(--chat-fab-size);
        height: var(--chat-fab-size);

      }

        width: var(--chat-fab-icon-size);
        height: var(--chat-fab-icon-size);
      }
      body.launcher .fab {
        display: grid;
      }

      /* ---- A static frame of the close (state=closing): 60 % through ---- */
      body.closing .devtools {

      }
      body.closing .agent-chat {
        right: 21px;
        bottom: 21px;

        height: 180px;

      }
      body.closing .agent-chat > * {
        opacity: 0;
      }
      body.closing.docked {
        padding-right: 90px;
      }

      @media (prefers-reduced-motion: reduce) {
        #top-bar .marquee span {
          padding-left: 8px;
          animation: none;
        }
        .caret {
          animation: none;
        }
      }

              'type-scale-details',

              ["[data-agent-id='section:education']", "[data-agent-id='section:about']"],
            ],
          ],
        },
        {
          id: 'colours',
          title: 'colours',
          fallback: 'Now the colours. Goodbye, star field.',
          effects: [
            ['layer', 'page-background', 'page', 'page'],
            ['layer', 'base-colors', 'page', 'page'],
            ['layer', 'heading-colors', 'name & titles', ["[data-testid='cv-name']", 'h2']],
            ['layer', 'tech-fills', 'technologies', [TECH]],
          ],
        },
        {
          id: 'layout',
          title: 'layout',
          fallback: "Now the layout. It's been leaning left since 2002.",
          effects: [
            ['layer', 'page-frame', 'page', 'page'],
            ['layer', 'header-layout', 'header', ["[data-agent-id='section:header']"]],
            ['layer', 'tech-grid', 'technologies', ["[data-agent-id='section:technologies']"]],
            [
              'layer',
              'experience-heads',
              'experience',
              [`${LATEST} [data-testid='cv-experience-entry']`],
            ],
            ['layer', 'app-stack', 'apps', ["[data-agent-id='section:apps']"]],
          ],
        },
        {
          id: 'images',
          title: 'images',
          fallback: 'The pictures were in the wrong folder. Fixing the paths.',
          effects: [
            ['layer', 'broken-photo', 'photo', ["[data-agent-id='section:header'] > img"]],
            ['deco', 'oh-snap', 'note', ['#oh-snap']],
            ['layer', 'squashed-logos', 'logos', ["[data-testid='cv-experience-entry'] img"]],
            ['layer', 'broken-icon', 'Savant icon', ["[data-agent-id='app:savant'] img"]],
            ['layer', 'broken-cover', 'book cover', ["[data-agent-id='book:siddhartha'] img"]],
          ],
        },
        {
          id: 'cards',
          title: 'cards',
          fallback: 'Tables are for data. Turning these into cards.',
          effects: [
            ['layer', 'tech-cells', 'technologies', [TECH]],
            ['layer', 'app-cells', 'apps', ["[data-testid='cv-app-card']"]],
            ['layer', 'card-colors', 'card borders', [TECH, "[data-testid='cv-app-card']"]],
            ['layer', 'book-frames', 'books', ["[data-testid='cv-book'] img"]],
          ],
        },
        {
          id: 'spacing',
          title: 'spacing & lists',
          fallback: 'Giving everything room to breathe. Goodbye, <hr>.',
          effects: [
            ['layer', 'heading-rules', 'section titles', ['h2']],
            ['layer', 'bullets', 'bullets', ["[data-testid='cv-summary']", LATEST]],
            ['layer', 'experience-rhythm', 'experience', [LATEST]],
            ['layer', 'about-spacing', 'about me', ["[data-agent-id='section:about']"]],
          ],
        },
        {
          id: 'chrome',
          title: '2002 chrome',
          fallback: 'Time to say goodbye to the marquee and the hit counter.',
          effects: [
            ['deco', 'top-bar', 'nav bar', ['#top-bar']],
            [
              'layer',
              'new-bursts',
              'NEW! badges',
              ["[data-agent-id='technology:ai-tools']", `${LATEST} h2`],
            ],
            ['deco', 'page-footer', 'footer', ['#page-footer']],
            ['layer', 'decor-room', 'page', 'page'],
            ['layer', 'hide-header', 'language switcher', ["[data-testid='app-header']"]],
          ],
        },
        {
          id: 'links',
          title: 'links & contacts',
          fallback: 'Last: links, contacts, and a real chat button.',
          effects: [
            ['layer', 'link-style', 'contacts', ["[data-agent-id='section:header'] address"]],
            ['layer', 'contact-labels', 'contacts', ["[data-agent-id='section:header'] address"]],
            ['module', 'ai-chat', null, null],
          ],
        },
      ];

      /* ------------------------------------------------------------------ chat (round 4 look) */
      // [kind, text]: agent = card on the left, visitor = navy bubble on the right,
      // notice = a neutral agent card (limit, scripted lines). No timestamps, no nicks.
      const CHAT = {
        open: [
          [
            'agent',
            'Oops... looks like this site got stuck in 2002 and is a bit broken. Tell me what you think while I fix it.',
          ],
        ],
        exchange: [
          ['visitor', "wow, a marquee! haven't seen one in 20 years"],
          ['agent', 'It belongs to the 2002 layout. It goes in the cleanup step, with the hit counter.'],
        ],
        console: [['agent', 'Opening my console. Every line I type lands on the page right away.']],
        between: [
          ['visitor', 'much better already'],
          ['agent', 'Thank you. The layout is next: a centred column and grids.'],
        ],
        finale: [
          [
            'agent',
            "Done. This is Andrew's CV as it looks today. Questions? The chat button is bottom right.",
          ],
        ],
      };
      // Chat up to the start of step `n` (its narration included); the exchange sits after step 2.
      const chatAt = (n) => [
        ...CHAT.open,
        ...CHAT.exchange,
        ...CHAT.console,
        ...STEPS.slice(0, n + 1).flatMap((s, i) => [
          ...(i === 2 ? CHAT.between : []),
          ['agent', s.fallback],
        ]),
      ];
      // at: [step, chunk, characters typed of that chunk (null = not typing)]; earlier chunks are
      // applied. hl: 'typing' marks the chunk being typed; 'applied' the chunk that just applied.
      const STATES = {
        broken: { at: [0, 0, null], dock: false },
        chat: {
          at: [0, 0, null],
          chat: [...CHAT.open, ...CHAT.exchange],
          draft: 'the purple name is a bold choice',
          console: false,
        },
        console: { at: [0, 0, 40], chat: chatAt(0), streaming: true, hl: 'typing' },
        'step1-mid': { at: [0, 3, 150], chat: chatAt(0), hl: 'typing' },
        step1: { at: [2, 0, null], chat: chatAt(1) },
        'colours-mid': { at: [1, 2, null], chat: chatAt(1), hl: 'applied' },
        'step2-mid': { at: [2, 2, null], chat: chatAt(2), hl: 'applied' },
        step2: { at: [3, 0, null], chat: chatAt(2) },
        'rest-mid': { at: [4, 1, null], chat: chatAt(4), hl: 'applied' },
        finale: { at: [8, 0, null], chat: [...chatAt(7), ...CHAT.finale] },
        closing: { at: [8, 0, null], chat: [...chatAt(7), ...CHAT.finale], closing: true },
        end: { at: [8, 0, null], dock: false, launcher: true },
      };

      const q = new URLSearchParams(location.search);
      const st = STATES[q.get('state')] || STATES.broken;
      const [atStep, atEffect, typed] = st.at;
      const active = STEPS.flatMap((s, i) =>
        s.effects.filter((_, j) => i > atStep || (i === atStep && j >= atEffect)),
      );
      const isActive = (kind, id) => active.some(([k, x]) => k === kind && x === id);

      /* ------------------------------------------------------------------ layer host */
      const url = (p) => new URL(p, location.href).href;
      const root = document.documentElement.style;
      root.setProperty('--retro-broken-image', `url('${url('assets/icon_broken_image.svg')}')`);
      root.setProperty('--retro-tile-stars', `url('${url('assets/retro_tile_stars.svg')}')`);
      root.setProperty('--retro-badge-new', `url('${url('assets/badge_new.svg')}')`);
      const loads = active
        .filter(([k]) => k === 'layer')
        .map(
          ([, id]) =>
            new Promise((done) => {
              const link = Object.assign(document.createElement('link'), {
                rel: 'stylesheet',
                href: `layers/${id}.css`,
              });
              link.dataset.retroLayer = id;
              link.onload = link.onerror = done;
              document.head.append(link);
            }),
        );
      const docked = st.dock !== false && q.get('dock') !== '0';
      document.body.classList.toggle('docked', docked);
      document.body.classList.toggle('closing', !!st.closing);
      document.body.classList.toggle('launcher', !!st.launcher || !!st.closing);

      /* Decorations: absolutely positioned over the page, anchored to hook elements. */
      const portal = document.getElementById('portal');
      for (const [k, id] of active) {
        if (k !== 'deco') continue;
        const el = Object.assign(document.createElement('div'), {
          id,
          className: 'deco',
          innerHTML: DECORATIONS[id],
        });
        portal.append(el);
      }
      const box = (sel) => {
        const r = document.querySelector(sel).getBoundingClientRect();
        return {
          left: r.left + scrollX,
          top: r.top + scrollY,
          right: r.right + scrollX,
          bottom: r.bottom + scrollY,
          width: r.width,
        };
      };
      const place = () => {
        const cv = box('[data-testid="cv"]');
        const set = (id, s) => {
          const el = document.getElementById(id);
          if (el) Object.assign(el.style, s);
        };
        set('top-bar', { left: `${cv.left}px`, top: `${cv.top}px`, width: `${cv.width}px` });
        set('page-footer', {
          left: `${cv.left}px`,
          top: `${cv.bottom - 200}px`,
          width: `${cv.width}px`,
        });
        if (isActive('layer', 'page-frame')) {
          const main = box('main');
          const header = box('[data-agent-id="section:header"]');
          set('oh-snap', { left: `${main.right + 28}px`, top: `${header.top + 40}px` });
        } else {
          const photo = box('[data-agent-id="section:header"] > img');
          set('oh-snap', { left: `${photo.right + 28 - 184}px`, top: `${photo.top - 12}px` });
        }
      };

      /* ------------------------------------------------------------------ highlight */
      // Chrome's Elements-tab overlay per match: margin, border, padding rings and the content box,
      // plus the plate (tag#id.class and size, or `tag × n`) in the page area's bottom-left corner.
      const px = (v) => Math.max(0, parseFloat(v) || 0);
      const ring = (cls, l, t, w, h, widths) => {
        const el = Object.assign(document.createElement('i'), { className: cls });
        Object.assign(el.style, {
          left: `${l}px`,
          top: `${t}px`,
          width: `${w}px`,
          height: `${h}px`,
          boxSizing: 'border-box',
          ...(widths && {
            background: 'none',
            borderStyle: 'solid',
            borderColor: `var(--retro-highlight-${cls === 'm' ? 'margin' : cls === 'b' ? 'border' : 'padding'})`,
            borderWidth: widths.map((n) => `${n}px`).join(' '),
          }),
        });
        return el;
      };
      const overlay = (el, phase) => {
        const r = el.getBoundingClientRect();
        const cs = getComputedStyle(el);
        const side = (p) => ['top', 'right', 'bottom', 'left'].map((s) => px(cs[`${p}${s[0].toUpperCase()}${s.slice(1)}`]));
        const m = side('margin');
        const b = ['top', 'right', 'bottom', 'left'].map((s) => px(cs[`border-${s}-width`]));
        const p = side('padding');
        const hl = Object.assign(document.createElement('div'), { className: `bm ${phase}` });
        Object.assign(hl.style, {
          left: `${r.left + scrollX - m[3]}px`,
          top: `${r.top + scrollY - m[0]}px`,
          width: `${r.width + m[1] + m[3]}px`,
          height: `${r.height + m[0] + m[2]}px`,
        });
        const W = r.width + m[1] + m[3];
        const H = r.height + m[0] + m[2];
        hl.append(
          ring('m', 0, 0, W, H, m),
          ring('b', m[3], m[0], r.width, r.height, b),
          ring('p', m[3] + b[3], m[0] + b[0], r.width - b[1] - b[3], r.height - b[0] - b[2], p),
          ring(
            'c',
            m[3] + b[3] + p[3],
            m[0] + b[0] + p[0],
            r.width - b[1] - b[3] - p[1] - p[3],
            r.height - b[0] - b[2] - p[0] - p[2],
          ),
        );
        portal.append(hl);
      };
      const plate = (label, size) => {
        const el = Object.assign(document.createElement('div'), { className: 'plate' });
        el.innerHTML = `<span>${label}</span><span class="size">${size}</span>`;
        portal.append(el);
      };
      const nodeLabel = (el) => {
        const cls = [...el.classList][0];
        return `<span class="tag">${el.tagName.toLowerCase()}</span>${el.id ? `<span class="cls">#${el.id}</span>` : ''}${cls ? `<span class="cls">.${cls}</span>` : ''}`;
      };
      const highlight = () => {
        if (!st.hl || !docked) return;
        const [step, chunk] = st.hl === 'applied' ? [atStep, atEffect - 1] : [atStep, atEffect];
        const targets = STEPS[step]?.effects[chunk]?.[3];
        if (!targets) return;
        const area = document.documentElement.clientWidth - (docked ? 400 : 0);
        if (targets === 'page') {
          portal.append(Object.assign(document.createElement('div'), { className: `bm-page ${st.hl}` }));
          return plate('<span class="tag">body</span>', `${area} × ${document.documentElement.clientHeight}`);
        }
        const matches = targets.flatMap((sel) => [
          ...document.querySelectorAll(`[data-retro-stage] ${sel}, #portal ${sel}`),
        ]);
        const inView = matches.filter((el) => {
          const r = el.getBoundingClientRect();
          return r.width > 0 && r.bottom > 0 && r.top < document.documentElement.clientHeight;
        });
        (inView.length ? inView.slice(0, 12) : matches.slice(0, 1)).forEach((el) => overlay(el, st.hl));
        const first = matches[0];
        const r = first.getBoundingClientRect();
        if (matches.length > 1) plate(nodeLabel(first), `× ${matches.length}`);
        else plate(nodeLabel(first), `${Math.round(r.width)} × ${Math.round(r.height)}`);
      };
      Promise.all(loads)
        .then(() => document.fonts.ready)
        .then(place)
        .then(highlight)
        .then(follow);
      addEventListener('resize', place);

      /* ------------------------------------------------------------------ console text */
      const read = (path) => {
        try {
          const x = new XMLHttpRequest();
          x.open('GET', path, false);
          x.send();
          return x.responseText;
        } catch {
          return null;
        }
      };
      const liveTokens = Object.fromEntries(
        [...(read('../../../src/theme/tokens.css') || '').matchAll(/(--[\w-]+):\s*([^;]+);/g)].map(
          (m) => [m[1], m[2].replace(/\s+/g, ' ').replace(/\( /g, '(').replace(/ \)/g, ')').trim()],
        ),
      );
      // The dock keeps today's look while token layers damage :root: it re-declares the site's
      // tokens with their live values (the real dock does the same from the site's stylesheet).
      const dock = document.getElementById('dock');
      // (The mock skips --retro-*: its proposed round-4 values above aren't in tokens.css yet.)
      for (const [name, value] of Object.entries(liveTokens))
        if (!name.startsWith('--retro-')) dock.style.setProperty(name, value);

      // A JS string literal as DevTools would show it: single quotes unless the value has one.
      const lit = (v) => (v.includes("'") ? `"${v}"` : `'${v}'`);
      // Code shown = code applied (ARCHITECTURE §2): one command per chunk kind.
      const chunkCode = ([kind, id, label]) => {
        const target = label ? [`// → ${label}`] : [];
        if (kind === 'deco')
          return { lines: [...target, `document.getElementById('${id}').remove()`], done: `#${id} removed` };
        if (kind === 'module')
          return { lines: ["const { ChatRoute } = await import('./chat')"], done: 'chat button loaded' };
        const css = read(`layers/${id}.css`) || '';
        if (css.trimStart().startsWith(':root')) {
          const decls = [...css.matchAll(/(--[\w-]+):\s*([^;]+);/g)];
          return {
            lines: [
              ...target,
              'const { style } = document.documentElement',
              ...decls.map(([, n]) => `style.setProperty('${n}', ${lit(liveTokens[n] ?? '?')})`),
            ],
            done: `${id}: ${decls.length} tokens set`,
          };
        }
        return {
          lines: [...target, `document.querySelector('style[data-retro-layer="${id}"]').remove()`],
          done: `${id} removed`,
        };
      };

      const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const js = (line) =>
        line.startsWith('//')
          ? `<span class="cm">${esc(line)}</span>`
          : line
              .split(/('[^']*'?|"[^"]*"?)/)
              .map((part, i) =>
                i % 2
                  ? `<span class="s">${esc(part)}</span>`
                  : esc(part)
                      .replace(/\b(const|await|import)\b/g, '<span class="k">$1</span>')
                      .replace(/\b(\d+)\b/g, '<span class="n">$1</span>'),
              )
              .join('');
      const icon = (name) => `<i class="ic" style="--icon: url(assets/devtools_${name}.svg)"></i>`;
      const caret = '<span class="caret"></span>';
      const rows = [];
      const row = (kind, html, ic) => rows.push(`<div class="cr ${kind}">${ic ? icon(ic) : ''}${html}</div>`);
      const total = STEPS.reduce((n, s) => n + s.effects.length, 0);
      row('log', esc(`Agent connected to andrew-cv: ${total} changes in ${STEPS.length} steps.`));
      let applied = 0;
      STEPS.forEach((s, i) => {
        const name = `${i + 1}/${STEPS.length} ${s.title}`;
        if (i < atStep) {
          applied += s.effects.length;
          return row('group closed', `<span class="ok">✓</span> ${esc(name)}`, 'triangle');
        }
        if (i > atStep) return;
        row('group', esc(name), 'triangle');
        s.effects.forEach((e, j) => {
          const { lines, done } = chunkCode(e);
          if (j < atEffect) {
            applied++;
            row('input', lines.map(js).join('\n'), 'prompt');
            row('result', 'undefined', 'result');
            row('log', `<span class="ok">✓</span> ${esc(done)}`);
          }
          if (j === atEffect && typed != null) {
            const text = lines.join('\n').slice(0, typed);
            row('prompt', text.split('\n').map(js).join('\n') + caret, 'prompt');
          }
        });
      });
      if (atStep >= STEPS.length) row('log end', `<span class="ok">✓</span> All fixes applied.`);
      if (typed == null) row('prompt', caret, 'prompt');
      const term = document.getElementById('console');
      term.innerHTML = rows.join('');

      const steps = STEPS.length - Math.min(atStep, STEPS.length);
      const badge = (n, ic, cls) =>
        `<span class="dt-badge${n ? '' : ' zero'}"><i class="ic ${cls}" style="--icon: url(assets/devtools_${ic}.svg)"></i>${n}</span>`;
      document.getElementById('badges').innerHTML =
        badge(total - applied, 'error', 'err') + badge(steps, 'warning', 'warn');
      document.getElementById('devtools').style.display = st.console === false ? 'none' : '';

      /* ------------------------------------------------------------------ chat */
      const msgs = st.chat || [];
      document.getElementById('chat-log').innerHTML = msgs
        .map(
          ([k, text], i) =>
            `<li class="ac-msg ${k === 'visitor' ? 'visitor' : 'agent'}">${esc(text)}${st.streaming && i === msgs.length - 1 ? '<span class="stream-caret"></span>' : ''}</li>`,
        )
        .join('');
      document.getElementById('input').innerHTML = st.draft
        ? `${esc(st.draft)}<span class="stream-caret"></span>`
        : '<span class="ph">Message the agent…</span>';
      document.getElementById('field').classList.toggle('focus', !!st.draft);
      document.getElementById('send').classList.toggle('disabled', !st.draft);
      function follow() {
        for (const el of [term, document.getElementById('chat-log')]) el.scrollTop = el.scrollHeight;
      }
      follow();
    </script>
  </body>
</html>
