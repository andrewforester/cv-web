<!doctype html>
<!--
  Static mock of the Retro Rebuild show (docs/design/retro/SPEC.md). Not product code.
  One CV markup styled by the real src/theme/tokens.css (= today's design). The 2002 look is a stack
  of damage layers listed in <html data-dmg>; each fix step removes layers. Open in a browser.
  Query params:
    state = broken (default) | chat | console | step1-mid | step1 | step2-mid | step2 | end
    dock  = 0   hide the chat/console dock (full-page renders)
    dmg   = space-separated layer list, overrides the state's (e.g. dmg=images%20chrome)
  Screenshots: render.sh next to this file.
-->
<html lang="en" data-dmg="fonts colours layout images cards rhythm chrome links">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Andrew Panasiuk - Homepage</title>
    <!-- Real tokens. Inter and IBM Plex Mono from Google Fonts for standalone viewing. -->
    <link rel="stylesheet" href="../../../src/theme/tokens.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=IBM+Plex+Mono:wght@400;600&display=block"
    />
    <style>
      /* ---- Proposed retro- tokens (SPEC → Proposed tokens). Chat, console, dock only. ---- */
      :root {
        --retro-dock-width: 384px;
        --retro-dock-inset: 16px;
        --retro-dock-gap: 12px;
        --retro-chat-height: 344px;
        --retro-win-face: #c0c0c0;
        --retro-win-light: #ffffff;
        --retro-win-shadow: #808080;
        --retro-win-dark: #0a0a0a;
        --retro-win-title: linear-gradient(90deg, #000080, #1084d0);
        --retro-win-title-text: #ffffff;
        --retro-win-font: Tahoma, Verdana, 'Segoe UI', sans-serif;
        --retro-win-font-size: 11px;
        --retro-term-bg: #000000;
        --retro-term-font: 'IBM Plex Mono', 'Courier New', monospace;
        --retro-term-font-size: 13px;
        --retro-term-line-height: 18px;
        --retro-code-font-size: 12px;
        --retro-code-line-height: 17px;
        --retro-term-text: #c0c0c0;
        --retro-term-dim: #808080;
        --retro-chat-agent: #33ff66;
        --retro-chat-visitor: #ffb000;
        --retro-code-selector: #55ffff;
        --retro-code-property: #ffff55;
        --retro-code-string: #55ff55;
        --retro-code-number: #ff55ff;
        --retro-code-add: #55ff55;
        --retro-code-add-bg: rgba(85, 255, 85, 0.1);
        --retro-code-del: #ff5555;
        --retro-code-del-bg: rgba(255, 85, 85, 0.1);
        --retro-progress: #000080;
        --retro-z-index: 1000;
      }

      /* =====================================================================================
         BASE = today's design (approximation of src/screens/cv/*.module.css, tokens only)
         ===================================================================================== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font-family: var(--font-family);
        font-size: var(--font-body-size);
        line-height: var(--font-body-line-height);
        letter-spacing: var(--letter-spacing);
        color: var(--color-text);
        background: var(--color-bg);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
        font: inherit;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .site {
        position: relative;
        padding: 64px var(--page-gutter) 48px;
      }
      html.docked .site {
        margin-right: calc(var(--retro-dock-width) + 2 * var(--retro-dock-inset));
      }
      .cv {
        max-width: var(--content-max-width);
        margin: 0 auto;
      }
      .r-only,
      .r-hr,
      .r-label,
      .broken,
      .r-note {
        display: none;
      }

      /* Header */
      .header {
        position: relative;
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas: 'intro photo' 'intro contacts';
        column-gap: var(--space-4);
        row-gap: var(--space-4);
      }
      .intro {
        grid-area: intro;
      }
      .name {
        margin-top: var(--space-1);
        font-size: var(--font-name-size);
        line-height: var(--font-name-line-height);
        font-weight: var(--font-name-weight);
      }
      .tagline {
        margin-top: var(--space-5);
        font-style: italic;
      }
      .photo {
        grid-area: photo;
        justify-self: end;
      }
      .photo img {
        display: block;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
      }
      .contacts {
        grid-area: contacts;
        justify-self: end;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: var(--space-2);
      }
      .contact {
        display: flex;
        align-items: center;
        gap: var(--space-1);
      }
      .contact img {
        width: 18px;
        height: 18px;
      }
      .contact .link {
        margin-left: var(--space-1);
      }

      /* Sections */
      .section-title {
        margin: var(--space-8) 0 var(--space-3);
        font-size: var(--font-section-size);
        line-height: var(--font-section-line-height);
        font-weight: var(--font-section-weight);
      }
      .section-title.first {
        margin-top: var(--space-7);
      }
      b.medium {
        font-weight: 500;
      }
      b.bi {
        font-weight: 700;
        font-style: italic;
      }

      /* Technologies */
      .tech {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        column-gap: var(--space-7);
        align-items: start;
      }
      .tech-col {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: var(--space-3) 15px;
        background: var(--color-bg);
        border: var(--border-card) solid var(--color-card-border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-card);
      }
      .card-title {
        font-size: var(--font-card-title-size);
        line-height: var(--font-card-title-line-height);
        font-weight: var(--font-card-title-weight);
      }
      .card-body {
        font-size: var(--font-card-body-size);
        line-height: var(--font-card-body-line-height);
      }
      .card.hl {
        border-color: var(--color-highlight);
      }
      .card .star {
        position: absolute;
        top: 0;
        right: 0;
        width: 18px;
        height: 18px;
        transform: translate(50%, -50%);
      }
      .card.ai {
        border-color: transparent;
      }
      .card.ai::before {
        content: '';
        position: absolute;
        inset: -1px;
        padding: 1.5px;
        border-radius: inherit;
        background: var(--gradient-ai);
        mask:
          linear-gradient(#000 0 0) content-box exclude,
          linear-gradient(#000 0 0);
      }

      /* Experience */
      .xp-list {
        display: flex;
        flex-direction: column;
        gap: var(--space-7);
      }
      .xp-head {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        grid-template-areas: 'logo company period' 'logo role role';
        column-gap: var(--space-3);
        row-gap: var(--space-1);
      }
      .xp-logo {
        grid-area: logo;
      }
      .xp-logo img {
        display: block;
        width: 36px;
        height: 36px;
        border-radius: var(--radius-logo);
        object-fit: contain;
        background: var(--color-bg);
      }
      .company {
        grid-area: company;
        font-size: var(--font-subsection-size);
        line-height: var(--font-subsection-line-height);
        font-weight: var(--font-subsection-weight);
      }
      .remote {
        position: relative;
        top: -8px;
        margin-left: 6px;
        font-size: var(--font-tag-size);
        line-height: var(--font-tag-line-height);
        font-weight: 400;
        font-style: italic;
        color: var(--color-text-muted);
      }
      .role {
        grid-area: role;
        line-height: var(--font-body-size);
        color: var(--color-text-secondary);
      }
      .period {
        grid-area: period;
        font-size: var(--font-meta-size);
        line-height: var(--font-meta-line-height);
        color: var(--color-text-secondary);
      }
      .bullets {
        margin-top: 9px;
      }

      /* Apps */
      .apps {
        display: flex;
        gap: var(--space-4);
      }
      .app {
        flex: 1 1 auto;
        padding: 15px;
        background: var(--color-bg);
        border: 0.75px solid var(--color-app-border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-card);
        letter-spacing: var(--letter-spacing-app);
        color: var(--color-app-text);
      }
      .app-name {
        font-size: var(--font-app-name-size);
        line-height: var(--font-app-name-line-height);
        font-weight: var(--font-app-name-weight);
      }
      .app-pub {
        margin-top: var(--space-1);
        font-size: var(--font-app-publisher-size);
        line-height: var(--font-app-publisher-line-height);
        font-weight: 500;
        color: var(--color-app-accent);
      }
      .app-stats {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        margin-top: var(--space-2);
      }
      .app-icon img {
        display: block;
        width: 36px;
        height: 36px;
        border-radius: var(--radius-logo);
      }
      .stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-1);
        white-space: nowrap;
      }
      .stat-value {
        display: inline-flex;
        align-items: center;
        font-size: var(--font-app-value-size);
        line-height: var(--font-app-value-line-height);
        font-weight: 500;
      }
      .stat-value img {
        width: 15px;
        height: 15px;
      }
      .stat-label {
        font-size: var(--font-app-label-size);
        line-height: var(--font-app-label-line-height);
        color: var(--color-app-muted);
      }
      .divider {
        width: 0.75px;
        height: 27px;
        background: color-mix(in srgb, var(--color-app-muted) 40%, transparent);
      }

      /* Education, about */
      .edu {
        font-size: var(--font-education-size);
        line-height: var(--font-education-line-height);
      }
      .subtitle {
        margin-bottom: var(--space-3);
        font-size: var(--font-subsection-size);
        line-height: var(--font-subsection-line-height);
        font-weight: var(--font-subsection-weight);
      }
      .books {
        display: flex;
        column-gap: 37px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .cover img {
        display: block;
        width: 100px;
        height: 150px;
        object-fit: cover;
        box-shadow: var(--shadow-book);
      }
      .book-cap {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-top: var(--space-3);
      }
      .book-title {
        font-size: var(--font-book-title-size);
        line-height: var(--font-book-title-line-height);
      }
      .book-author {
        font-size: var(--font-book-author-size);
        line-height: var(--font-book-author-line-height);
      }
      .interests-title {
        margin-top: var(--space-7);
      }
      .interests {
        font-size: var(--font-meta-size);
        line-height: var(--font-meta-line-height);
      }

      /* =====================================================================================
         DAMAGE LAYERS: each block is one deviation from today's design (SPEC → Broken page).
         A fix step removes its layer(s) from <html data-dmg>.
         ===================================================================================== */

      /* -- fonts (step 1a): families and sizes of 2002 -- */
      html[data-dmg~='fonts'] {
        --font-family: Verdana, Geneva, sans-serif;
        --letter-spacing: normal;
        --letter-spacing-app: normal;
        --font-body-size: 11px;
        --font-body-line-height: 15px;
        --font-name-size: 34px;
        --font-name-line-height: 38px;
        --font-section-size: 24px;
        --font-section-line-height: 28px;
        --font-subsection-size: 15px;
        --font-subsection-line-height: 18px;
        --font-card-title-size: 12px;
        --font-card-title-line-height: 15px;
        --font-card-body-size: 11px;
        --font-card-body-line-height: 14px;
        --font-meta-size: 11px;
        --font-meta-line-height: 14px;
        --font-education-size: 13px;
        --font-education-line-height: 16px;
        --font-book-title-size: 11px;
        --font-book-title-line-height: 13px;
        --font-book-author-size: 10px;
        --font-book-author-line-height: 12px;
        --font-app-name-size: 13px;
        --font-app-name-line-height: 16px;
        --font-app-publisher-size: 10px;
        --font-app-publisher-line-height: 12px;
        --font-app-value-size: 11px;
        --font-app-value-line-height: 13px;
        --font-app-label-size: 10px;
        --font-app-label-line-height: 12px;
      }
      html[data-dmg~='fonts'] :is(.name, .section-title, .company, .subtitle) {
        font-family: 'Times New Roman', Times, serif;
        font-weight: 700;
      }
      html[data-dmg~='fonts'] :is(.card-title, .app-name) {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
      }

      /* -- colours (step 1b): garish palette + tiled background -- */
      html[data-dmg~='colours'] {
        --color-bg: #ffffcc;
        --color-text: #000000;
        --color-text-secondary: #008000;
        --color-text-muted: #808080;
        --color-card-border: #808080;
        --color-highlight: #ffff00;
        --color-app-text: #000000;
        --color-app-muted: #666666;
        --color-app-accent: #0000ff;
        --color-app-border: #000000;
      }
      html[data-dmg~='colours'] body {
        background: #000033 url('assets/retro_tile_stars.svg') repeat;
      }
      html[data-dmg~='colours'] .cv {
        background: var(--color-bg);
      }
      html[data-dmg~='colours'] .name {
        color: #800080;
      }
      html[data-dmg~='colours'] .section-title {
        color: #cc0000;
      }
      html[data-dmg~='colours'] .card {
        background: #ccffff;
      }
      html[data-dmg~='colours'] .card.hl {
        background: #ffff00;
      }
      html[data-dmg~='colours'] .card.ai {
        background: #ffccff;
      }
      html[data-dmg~='colours'] .app {
        background: #ccffcc;
      }

      /* -- layout (step 2): fixed 640 px table pushed to the left, centred header, cramped grid -- */
      html[data-dmg~='layout'] .site {
        padding: 8px;
      }
      html[data-dmg~='layout'] .cv {
        width: 640px;
        max-width: none;
        margin: 0;
        padding: 6px;
        border: 3px outset #c0c0c0;
      }
      html[data-dmg~='layout'] .header {
        display: block;
        text-align: center;
      }
      html[data-dmg~='layout'] .photo {
        float: left;
        margin: 0 8px 4px 0;
      }
      html[data-dmg~='layout'] .r-note {
        top: 40px;
        right: auto;
        left: calc(100% + 36px);
      }
      html[data-dmg~='layout'] .contacts {
        display: block;
        justify-self: auto;
        clear: both;
        padding-top: 6px;
      }
      html[data-dmg~='layout'] .contact {
        display: inline;
        text-align: center;
        margin: 0 4px;
      }
      html[data-dmg~='layout'] .tech {
        column-gap: 2px;
      }
      html[data-dmg~='layout'] .tech-col {
        gap: 2px;
      }
      html[data-dmg~='layout'] .title-tech {
        text-align: center;
      }
      html[data-dmg~='layout'] .xp-head {
        display: block;
      }
      html[data-dmg~='layout'] .xp-logo {
        float: left;
        margin: 2px 6px 0 0;
      }
      html[data-dmg~='layout'] :is(.company, .role) {
        display: block;
      }
      html[data-dmg~='layout'] .period {
        display: block;
        font-style: italic;
      }
      html[data-dmg~='layout'] .bullets {
        clear: both;
      }
      html[data-dmg~='layout'] .apps {
        display: block;
        margin-left: 40px; /* a <blockquote> used for indentation */
      }
      html[data-dmg~='layout'] .app {
        margin-bottom: 4px;
      }
      html[data-dmg~='layout'] .books {
        column-gap: 12px;
      }

      /* -- images (step 3): broken files, squashed logos -- */
      html[data-dmg~='images'] .img.is-broken > img {
        display: none;
      }
      html[data-dmg~='images'] .img.is-broken > .broken {
        display: inline-flex;
        align-items: flex-start;
        gap: 2px;
        padding: 2px;
        overflow: hidden;
        border: 1px inset #c0c0c0;
        font: 11px/13px Verdana, Geneva, sans-serif;
        letter-spacing: normal;
        color: #000000;
        text-align: left;
        vertical-align: top;
      }
      html[data-dmg~='images'] .broken img {
        flex: none;
        width: 16px;
        height: 16px;
      }
      html[data-dmg~='images'] .xp-logo:not(.is-broken) img {
        width: 64px;
        height: 28px;
        object-fit: fill;
        border-radius: 0;
      }
      html[data-dmg~='images'] .xp-head {
        grid-template-columns: auto 1fr auto;
      }
      html[data-dmg~='images'] .photo img {
        border-radius: 0;
      }
      html[data-dmg~='images'] .r-note {
        display: block;
      }

      /* -- cards (step 4): table cells instead of cards -- */
      html[data-dmg~='cards'] .card {
        padding: 4px;
        border: 2px inset #c0c0c0;
        border-radius: 0;
        box-shadow: none;
        gap: 2px;
      }
      html[data-dmg~='cards'] .card .star,
      html[data-dmg~='cards'] .card.ai::before {
        display: none;
      }
      html[data-dmg~='cards'] .app {
        padding: 4px;
        border: 1px solid var(--color-app-border);
        border-radius: 0;
        box-shadow: none;
      }
      html[data-dmg~='cards'] .app-icon img,
      html[data-dmg~='cards'] .xp-logo img {
        border-radius: 0;
      }
      html[data-dmg~='cards'] .cover img {
        box-shadow: none;
        border: 2px solid #000000;
      }

      /* -- rhythm (step 5): <hr> under titles, bullets, cramped spacing -- */
      html[data-dmg~='rhythm'] .section-title {
        margin: 16px 0 2px;
      }
      html[data-dmg~='rhythm'] .r-hr {
        display: block;
        margin: 0 0 8px;
        border: 0;
        border-top: 2px groove #c0c0c0;
      }
      html[data-dmg~='rhythm'] :is(.summary p, .bullets p) {
        display: list-item;
        margin-left: 28px;
        list-style: disc outside;
      }
      html[data-dmg~='rhythm'] .bullets p {
        list-style-type: square;
      }
      html[data-dmg~='rhythm'] .xp-list {
        gap: 12px;
      }
      html[data-dmg~='rhythm'] .bullets {
        margin-top: 2px;
      }
      html[data-dmg~='rhythm'] .tagline {
        margin-top: 2px;
      }
      html[data-dmg~='rhythm'] .interests-title {
        margin-top: 12px;
      }
      html[data-dmg~='rhythm'] .subtitle {
        margin-bottom: 4px;
      }

      /* -- chrome (step 6): 2002 homepage furniture -- */
      html[data-dmg~='chrome'] .r-only {
        display: block;
      }
      html[data-dmg~='chrome'] .r-only.inline {
        display: inline-block;
      }
      .r-nav {
        margin: -2px -2px 6px;
        padding: 3px;
        text-align: center;
        background: #000080;
      }
      .r-nav a {
        display: inline-block;
        margin: 1px;
        padding: 2px 10px;
        font: bold 11px/14px Verdana, Geneva, sans-serif;
        color: #000000;
        background: #c0c0c0;
        border: 2px outset #ffffff;
        text-decoration: none;
      }
      .r-marquee {
        overflow: hidden;
        margin-bottom: 8px;
        border: 1px solid #ff0000;
        background: #000000;
        color: #ffff00;
        font: bold 13px/20px 'Comic Sans MS', 'Comic Neue', cursive;
        white-space: nowrap;
      }
      .r-marquee span {
        display: inline-block;
        padding-left: 100%;
        animation: marquee 18s linear infinite;
      }
      @keyframes marquee {
        to {
          transform: translateX(-100%);
        }
      }
      .r-new {
        margin-left: 6px;
        vertical-align: middle;
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          visibility: hidden;
        }
      }
      .r-footer {
        margin-top: 20px;
        padding-top: 8px;
        border-top: 2px groove #c0c0c0;
        text-align: center;
        font: 11px/16px Verdana, Geneva, sans-serif;
        color: #000000;
        letter-spacing: normal;
      }
      .r-footer p {
        margin: 4px 0;
      }
      .r-footer a {
        color: #0000ee;
        text-decoration: underline;
      }
      .r-counter {
        display: inline-flex;
        gap: 1px;
        padding: 2px;
        background: #404040;
        vertical-align: middle;
      }
      .r-counter span {
        width: 12px;
        font: bold 14px/18px 'Courier New', monospace;
        color: #33ff33;
        background: #000000;
        text-align: center;
      }
      .r-badges img {
        margin: 0 3px;
        vertical-align: middle;
      }
      /* On the photo corner once the layout is fixed; in the margin right of the table before. */
      .r-note {
        position: absolute;
        top: -12px;
        right: -28px;
        z-index: 1;
        width: 184px;
        padding: 10px 12px;
        background: #ffff99;
        border: 1px solid #cc9900;
        box-shadow: 3px 3px 0 #000000;
        font: 13px/17px 'Comic Sans MS', 'Comic Neue', cursive;
        color: #000000;
        letter-spacing: normal;
        transform: rotate(2.5deg);
        text-align: left;
      }
      .r-note strong {
        display: block;
        font-size: 18px;

      .win-btn {

        height: 14px;

      .term {

        margin-top: 2px;
        padding: 6px 8px;

        background: var(--retro-term-bg);

      .composer .ph {

      .caret {

      /* console */

      .c-step {

      .progress {

      .progress .label {
        flex: none;

      .bar {

      @media (prefers-reduced-motion: reduce) {

          animation: none;
          padding-left: 8px;
        }
        .r-new,
        .caret {

      const S = {
        broken: { dmg: ALL, dock: false },
        chat: { dmg: ALL, chat: [...CHAT_OPEN, ...CHAT_EXCHANGE], typing: 'the purple name is a bold choice', console: null },
        console: {
          dmg: ALL,
          chat: [...CHAT_OPEN, ...CHAT_EXCHANGE, ...CHAT_CONSOLE],
          console: [...PROMPT, ...STEP1_FONTS.slice(0, 4)],
          caret: true, step: 1, pct: 4,
        },
        'step1-mid': {
          dmg: without('fonts'),
          chat: [...CHAT_OPEN, ...CHAT_EXCHANGE, ...CHAT_CONSOLE],
          console: [...PROMPT, ...STEP1_FONTS, ...STEP1_COLOURS.slice(0, 3)],
          caret: true, step: 1, pct: 9,
        },
        step1: {
          dmg: without('fonts', 'colours'),
          chat: [...CHAT_OPEN, ...CHAT_EXCHANGE, ...CHAT_CONSOLE, ...CHAT_STEP1],
          console: [...PROMPT, ...STEP1_FONTS, ...STEP1_COLOURS, ...done(1)],
          caret: true, step: 2, pct: 14,
        },
        'step2-mid': {
          dmg: without('fonts', 'colours'),
          chat: [...CHAT_OPEN, ...CHAT_EXCHANGE, ...CHAT_CONSOLE, ...CHAT_STEP1, ...CHAT_STEP2.slice(0, 2)],
          console: [...PROMPT, ...done(1), ...STEP2_LAYOUT.slice(0, 6)],
          caret: true, step: 2, pct: 20,
        },
        step2: {
          dmg: without('fonts', 'colours', 'layout'),
          chat: [...CHAT_OPEN, ...CHAT_EXCHANGE, ...CHAT_CONSOLE, ...CHAT_STEP1, ...CHAT_STEP2],
          console: [...PROMPT, ...done(1), ...STEP2_LAYOUT, ...done(2)],
          caret: true, step: 3, pct: 29,
        },
        end: {
          dmg: [],
          chat: [...CHAT_OPEN, ...CHAT_EXCHANGE, ...CHAT_CONSOLE, ...CHAT_STEP1, ...CHAT_STEP2, ...CHAT_END],
          console: [...PROMPT, ...[1, 2, 3, 4, 5, 6, 7].flatMap(done), ['prompt', '$ '], ['ok', 'all 7 fixes applied. Welcome to 2026.']],
          caret: false, step: 7, pct: 100,
        },
      };

      const q = new URLSearchParams(location.search);
      const st = S[q.get('state')] || S.broken;
      const dmg = q.has('dmg') ? q.get('dmg').split(/\s+/).filter(Boolean) : st.dmg;
      document.documentElement.dataset.dmg = dmg.join(' ');
      const docked = st.dock !== false && q.get('dock') !== '0';
      document.documentElement.classList.toggle('docked', docked);

      const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      // Chat
      const NICK = { agent: '&lt;agent&gt;', visitor: '&lt;you&gt;' };
      document.getElementById('chat-log').innerHTML = (st.chat || [])
        .map(([t, k, text]) =>
          k === 'sys'
            ? `<div class="msg sys"><span class="ts">[${t}]</span> ${esc(text)}</div>`
            : `<div class="msg ${k}"><span class="ts">[${t}]</span> <span class="nick">${NICK[k]}</span> ${esc(text)}</div>`,
        )
        .join('');
      document.getElementById('composer').innerHTML = st.typing
        ? `<span>you&gt;</span><span>${esc(st.typing)}<span class="caret"></span></span>`
        : `<span>you&gt;</span><span><span class="caret"></span><span class="ph"> type here, press Enter</span></span>`;

      // Console: a tiny CSS highlighter
      const hlCode = (s) =>
        esc(s)
          .replace(/(@import|@media)/g, '<span class="c-num">$1</span>')
          .replace(/^(\s*)(--[\w-]+|[a-z-]+)(:)/, '$1<span class="c-prop">$2</span>$3')
          .replace(/(#[0-9a-f]{3,6}\b|\b\d+(?:px|%|fr)?)(?![^<]*>)/gi, '<span class="c-num">$1</span>')
          .replace(/^([.:\w][\w\s,.-]*)(\s\{)/, '<span class="c-sel">$1</span>$2');
      const hl = (s) =>
        s
          .split(/('[^']*')/)
          .map((part, i) => (i % 2 ? `<span class="c-str">${esc(part)}</span>` : hlCode(part)))
          .join('');
      const lines = st.console || [];
      const html = lines.map(([k, s], i) => {
        const last = i === lines.length - 1 && st.caret ? '<span class="caret"></span>' : '';
        switch (k) {
          case 'prompt': return `<div class="ln"><span class="c-prompt">${esc(s)}</span>${last}</div>`;
          case 'step': return `<div class="ln"><span class="c-com">${esc(s)}</span>${last}</div>`;
          case 'file': return `<div class="ln"><span class="c-file">${esc(s)}</span>${last}</div>`;
          case 'hunk': return `<div class="ln"><span class="g"> </span>${hl(s)}${last}</div>`;
          case 'add': return `<div class="ln add"><span class="g">+</span>${hl(s)}${last}</div>`;
          case 'del': return `<div class="ln del"><span class="g">-</span>${esc(s)}${last}</div>`;
          case 'ok': return `<div class="ln"><span class="c-ok">${esc(s).replace(/^(\s*)ok/, '$1&#10003;')}</span>${last}</div>`;
          default: return `<div class="ln">${esc(s)}${last}</div>`;
        }
      });
      const term = document.getElementById('console-term');
      term.innerHTML = html.join('');
      document.getElementById('console').style.display = st.console ? '' : 'none';
      if (st.step) {
        document.getElementById('progress-label').textContent =
          st.pct === 100 ? 'All fixes applied' : `Step ${st.step} of 7: ${STEPS[st.step - 1]}`;
        document.getElementById('progress-bar').style.width = `${st.pct}%`;
        document.getElementById('progress-pct').textContent = `${st.pct}%`;
      }
      // Terminals follow their last line.
      for (const el of [term, document.getElementById('chat-log')]) el.scrollTop = el.scrollHeight;
    </script>
  </body>
</html>
