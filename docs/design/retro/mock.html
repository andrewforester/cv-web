<!doctype html>
<!--
  Static mock of the Retro Rebuild show (docs/design/retro/SPEC.md). Not product code.
  It follows docs/retro/ARCHITECTURE.md: the page is today's CV (same element types and hooks as
  src/screens/cv: data-testid, data-agent-id) styled by the real src/theme/tokens.css; the 2002 look
  is the damage layers in layers/*.css, injected as <link data-retro-layer> at the end of <head>,
  plus show-owned decorations in a portal. A fix step removes layers and decorations.
  The console text is generated from the layer files, so open it over http or with render.sh:
    python3 -m http.server  (repo root)  →  http://localhost:8000/docs/design/retro/mock.html
  Query params:
    state = broken (default) | chat | console | step1-mid | step1 | step2-mid | step2 | rest-mid | end
    dock  = 0   hide the chat/console dock (full-page renders)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Andrew Panasiuk - Homepage</title>
    <!-- Real tokens. Inter and IBM Plex Mono from Google Fonts for standalone viewing. -->
    <link rel="stylesheet" href="../../../src/theme/tokens.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=IBM+Plex+Mono:wght@400;600&display=block"
    />
    <style>
      /* ---- Proposed retro- tokens (SPEC → Proposed tokens): dock, chat, console only ---- */
      :root {
        --retro-dock-width: 384px;
        --retro-dock-inset: 16px;
        --retro-dock-gap: 12px;
        --retro-chat-height: 344px;
        --retro-win-face: #c0c0c0;
        --retro-win-light: #ffffff;
        --retro-win-shadow: #808080;
        --retro-win-dark: #0a0a0a;
        --retro-win-title: linear-gradient(90deg, #000080, #1084d0);
        --retro-win-title-text: #ffffff;
        --retro-win-font: Tahoma, Verdana, 'Segoe UI', sans-serif;
        --retro-win-font-size: 11px;
        --retro-term-bg: #000000;
        --retro-term-font: 'IBM Plex Mono', 'Courier New', monospace;
        --retro-term-font-size: 13px;
        --retro-term-line-height: 18px;
        --retro-code-font-size: 12px;
        --retro-code-line-height: 17px;
        --retro-term-text: #c0c0c0;
        --retro-term-dim: #808080;
        --retro-chat-agent: #33ff66;
        --retro-chat-visitor: #ffb000;
        --retro-code-selector: #55ffff;
        --retro-code-property: #ffff55;
        --retro-code-string: #55ff55;
        --retro-code-number: #ff55ff;
        --retro-code-add: #55ff55;
        --retro-code-add-bg: rgba(85, 255, 85, 0.1);
        --retro-code-del: #ff5555;
        --retro-code-del-bg: rgba(255, 85, 85, 0.1);
        --retro-progress: #000080;
        --retro-z-index: 1001;
        --retro-highlight-ink: #000000;
        --retro-page-frame-inset: 6px;
      }

      /* =====================================================================================
         TODAY'S SITE: approximation of src/theme/global.css, src/app and src/screens/cv modules.
         Classes stand in for CSS Module classes; layers never select them.
         ===================================================================================== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--font-family);
        font-size: var(--font-body-size);
        line-height: var(--font-body-line-height);
        font-weight: var(--font-body-weight);
        letter-spacing: var(--letter-spacing);
        color: var(--color-text);
        background: var(--color-bg);
      }
      h1,
      h2,
      h3,
      p,
      figure {
        margin: 0;
      }
      h1,
      h2,
      h3 {
        font-size: inherit;
        font-weight: inherit;
      }
      .shell {
        max-width: calc(var(--content-max-width) + 2 * var(--page-gutter));
        margin: 0 auto;
        padding: var(--space-4) var(--page-gutter) calc(var(--chat-fab-size) + 2 * var(--space-6));
      }
      .app-header {
        display: flex;
        justify-content: flex-end;
        margin-bottom: var(--space-8);
      }
      .switcher {
        display: inline-flex;
        gap: var(--space-1);
      }
      .switcher button {
        padding: var(--space-1) var(--space-3);
        font: inherit;
        font-size: var(--font-meta-size);
        color: var(--color-text);
        background: var(--color-bg);
        border: var(--border-card) solid var(--color-card-border);
        border-radius: var(--radius-logo);
      }
      .switcher button[aria-pressed='true'] {
        color: var(--color-bg);
        background: var(--color-text);
        border-color: var(--color-text);
      }
      /* HeaderSection */
      .hdr {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas: 'intro photo' 'intro contacts';
        column-gap: var(--space-4);
        row-gap: var(--space-4);
      }
      .intro {
        grid-area: intro;
      }
      .name {
        margin-top: var(--space-1);
        font-size: var(--font-name-size);
        line-height: var(--font-name-line-height);
        font-weight: var(--font-name-weight);
      }
      .tagline {
        margin-top: var(--space-5);
        font-style: italic;
      }
      .photo {
        grid-area: photo;
        justify-self: end;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
      }
      /* ContactList */
      .contacts {
        grid-area: contacts;
        justify-self: end;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: var(--space-2);
        font-style: normal;
      }
      .row {
        display: flex;
        align-items: center;
        gap: var(--space-1);
      }
      .row a {
        display: inline-flex;
      }
      .icon {
        width: 18px;
        height: 18px;
      }
      .link {
        margin-left: var(--space-1);
        color: inherit;
        text-decoration: none;
      }
      /* SectionTitle */
      .title {
        margin: var(--space-8) 0 var(--space-3);
        font-size: var(--font-section-size);
        line-height: var(--font-section-line-height);
        font-weight: var(--font-section-weight);
      }
      .title.first {
        margin-top: var(--space-7);
      }
      .medium {
        font-weight: 500;
      }
      .bi {
        font-weight: 700;
        font-style: italic;
      }
      /* TechnologiesSection, TechnologyCardView */
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        column-gap: var(--space-7);
        align-items: start;
      }
      .column {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: var(--space-3) 15px;
        background: var(--color-bg);
        border: var(--border-card) solid var(--color-card-border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-card);
      }
      .card-title {
        font-size: var(--font-card-title-size);
        line-height: var(--font-card-title-line-height);
        font-weight: var(--font-card-title-weight);
      }
      .card-body {
        font-size: var(--font-card-body-size);
        line-height: var(--font-card-body-line-height);
      }
      .card.hl {
        border-color: var(--color-highlight);
      }
      .star {
        position: absolute;
        top: 0;
        right: 0;
        width: 18px;
        height: 18px;
        transform: translate(50%, -50%);
      }
      .card.ai {
        border-color: transparent;
      }
      .card.ai::before {
        content: '';
        position: absolute;
        inset: -1px;
        padding: 1.5px;
        border-radius: inherit;
        background: var(--gradient-ai);
        mask:
          linear-gradient(#000 0 0) content-box exclude,
          linear-gradient(#000 0 0);
      }
      /* ExperienceList, ExperienceEntry */
      .xp-list {
        display: flex;
        flex-direction: column;
        gap: var(--space-7);
      }
      .head {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        grid-template-areas: 'logo company period' 'logo role role';
        column-gap: var(--space-3);
        row-gap: var(--space-1);
        align-items: start;
      }
      .logo {
        grid-area: logo;
        width: 36px;
        height: 36px;
        border-radius: var(--radius-logo);
        object-fit: contain;
        background: var(--color-bg);
      }
      .company {
        grid-area: company;
        font-size: var(--font-subsection-size);
        line-height: var(--font-subsection-line-height);
        font-weight: var(--font-subsection-weight);
      }
      .remote {
        position: relative;
        top: -8px;
        margin-left: 6px;
        font-size: var(--font-tag-size);
        line-height: var(--font-tag-line-height);
        font-weight: 400;
        font-style: italic;
        color: var(--color-text-muted);
      }
      .role {
        grid-area: role;
        line-height: var(--font-body-size);
        color: var(--color-text-secondary);
      }
      .period {
        grid-area: period;
        font-size: var(--font-meta-size);
        line-height: var(--font-meta-line-height);
        color: var(--color-text-secondary);
      }
      .bullets {
        margin-top: 9px;
      }
      /* AppsSection, AppCardView, AppStat */
      .apps {
        display: flex;
        gap: var(--space-4);
      }
      .app {
        flex: 1 1 auto;
        padding: 15px;
        background: var(--color-bg);
        border: 0.75px solid var(--color-app-border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-card);
        letter-spacing: var(--letter-spacing-app);
        color: var(--color-app-text);
      }
      .app-name {
        font-size: var(--font-app-name-size);
        line-height: var(--font-app-name-line-height);
        font-weight: var(--font-app-name-weight);
      }
      .app-pub {
        margin-top: var(--space-1);
        font-size: var(--font-app-publisher-size);
        line-height: var(--font-app-publisher-line-height);
        font-weight: 500;
        color: var(--color-app-accent);
      }
      .app-stats {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        margin-top: var(--space-2);
      }
      .app-icon {
        flex: none;
        width: 36px;
        height: 36px;
        border-radius: var(--radius-logo);
      }
      .stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-1);
        white-space: nowrap;
      }
      .stat-value {
        display: inline-flex;
        align-items: center;
        font-size: var(--font-app-value-size);
        line-height: var(--font-app-value-line-height);
        font-weight: 500;
      }
      .stat-value img {
        width: 15px;
        height: 15px;
      }
      .stat-label {
        font-size: var(--font-app-label-size);
        line-height: var(--font-app-label-line-height);
        color: var(--color-app-muted);
      }
      .divider {
        flex: none;
        width: 0.75px;
        height: 27px;
        background: color-mix(in srgb, var(--color-app-muted) 40%, transparent);
      }
      /* EducationSection, AboutSection, BookView */
      .edu {
        font-size: var(--font-education-size);
        line-height: var(--font-education-line-height);
      }
      .subtitle {
        margin-bottom: var(--space-3);
        font-size: var(--font-subsection-size);
        line-height: var(--font-subsection-line-height);
        font-weight: var(--font-subsection-weight);
      }
      .books {
        display: flex;
        column-gap: 37px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .cover {
        display: block;
        width: 100px;
        height: 150px;
        object-fit: cover;
        box-shadow: var(--shadow-book);
      }
      .book-cap {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-top: var(--space-3);
      }
      .book-title {
        font-size: var(--font-book-title-size);
        line-height: var(--font-book-title-line-height);
      }
      .book-author {
        font-size: var(--font-book-author-size);
        line-height: var(--font-book-author-line-height);
      }
      .interests-title {
        margin-top: var(--space-7);
      }
      .interests {
        font-size: var(--font-meta-size);
        line-height: var(--font-meta-line-height);
      }

      /* =====================================================================================
         SHOW: stage reserve for the dock, decorations (show-owned DOM in a portal).
         ===================================================================================== */
      body.docked {
        padding-right: calc(var(--retro-dock-width) + 2 * var(--retro-dock-inset));
      }
      .deco {
        position: absolute;
        z-index: 1;
        letter-spacing: normal;
      }
      /* Highlight of the chunk's target (SPEC → Show what changed): a Paint-style selection in the
         console's green, drawn over the page by the show; `.page` frames the whole page area. */
      .target-hl {
        position: absolute;
        z-index: 2;
        box-sizing: border-box;
        border: var(--agent-highlight-width) solid var(--retro-code-add);
        outline: var(--agent-highlight-width) dashed var(--retro-highlight-ink);
        outline-offset: calc(-1 * var(--agent-highlight-width));
        pointer-events: none;
      }
      .target-hl.applied {
        background: var(--retro-code-add-bg);
      }
      .target-hl.page {
        position: fixed;
        inset: var(--retro-page-frame-inset);
        background: none;
      }
      body.docked .target-hl.page {
        right: calc(
          var(--retro-dock-width) + 2 * var(--retro-dock-inset) + var(--retro-page-frame-inset)
        );
      }
      @keyframes retro-blink {
        50% {
          visibility: hidden;
        }
      }
      #top-bar {
        font:
          11px/14px Verdana,
          Geneva,
          sans-serif;
      }
      #top-bar nav {
        margin-bottom: 8px;
        padding: 3px;
        text-align: center;
        background: #000080;
      }
      #top-bar nav span {
        display: inline-block;
        margin: 1px;
        padding: 2px 10px;
        font-weight: 700;
        color: #000000;
        background: #c0c0c0;
        border: 2px outset #ffffff;
        text-decoration: underline;
      }
      #top-bar .marquee {
        overflow: hidden;
        border: 1px solid #ff0000;
        background: #000000;
        color: #ffff00;
        font:
          bold 13px/20px 'Comic Sans MS',
          'Comic Neue',
          cursive;
        white-space: nowrap;
      }
      #top-bar .marquee span {
        display: inline-block;
        padding-left: 100%;
        animation: marquee 18s linear infinite;
      }
      @keyframes marquee {
        to {
          transform: translateX(-100%);
        }
      }
      #page-footer {
        padding-top: 8px;
        border-top: 2px groove #c0c0c0;
        text-align: center;
        font:
          11px/16px Verdana,
          Geneva,
          sans-serif;
        color: #000000;
      }
      #page-footer p {
        margin: 4px 0;
      }
      #page-footer u {
        color: #0000ee;
      }
      .counter {
        display: inline-flex;
        gap: 1px;
        padding: 2px;
        background: #404040;
        vertical-align: middle;
      }
      .counter span {
        width: 12px;
        font:
          bold 14px/18px 'Courier New',
          monospace;
        color: #33ff33;
        background: #000000;
        text-align: center;
      }
      #page-footer .badges img {
        margin: 0 3px;
        vertical-align: middle;
      }
      #oh-snap {
        width: 184px;
        padding: 10px 12px;
        background: #ffff99;
        border: 1px solid #cc9900;
        box-shadow: 3px 3px 0 #000000;
        font:
          13px/17px 'Comic Sans MS',
          'Comic Neue',
          cursive;
        color: #000000;
        transform: rotate(2.5deg);
      }
      #oh-snap strong {
        display: block;
        font-size: 18px;
        line-height: 24px;
        color: #cc0000;
      }

      /* =====================================================================================
         DOCK: terminal chat (bottom) + live-fix console (above). New UI, retro-styled.
         ===================================================================================== */
      .dock {
        position: fixed;
        top: var(--retro-dock-inset);
        right: var(--retro-dock-inset);
        bottom: var(--retro-dock-inset);
        z-index: var(--retro-z-index);
        display: none;
        flex-direction: column;
        justify-content: flex-end;
        gap: var(--retro-dock-gap);
        width: var(--retro-dock-width);
      }
      body.docked .dock {
        display: flex;
      }
      .win {
        display: flex;
        flex-direction: column;
        padding: 3px;
        background: var(--retro-win-face);
        box-shadow:
          inset -1px -1px var(--retro-win-dark),
          inset 1px 1px var(--retro-win-light),
          inset -2px -2px var(--retro-win-shadow),
          inset 2px 2px #dfdfdf,
          4px 4px 0 rgba(0, 0, 0, 0.35);
        font-family: var(--retro-win-font);
        font-size: var(--retro-win-font-size);
        letter-spacing: normal;
        color: #000000;
      }
      .win.chat {
        flex: none;
        height: var(--retro-chat-height);
      }
      .win.console {
        flex: 1;
        min-height: 0;
      }
      .win-title {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 18px;
        padding: 0 2px 0 3px;
        background: var(--retro-win-title);
        color: var(--retro-win-title-text);
        font-weight: 700;
      }
      .win-title .t {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .win-title svg {
        flex: none;
      }
      .win-btn {
        flex: none;
        width: 16px;
        height: 14px;
        padding: 0;
        background: var(--retro-win-face);
        border: 0;
        box-shadow:
          inset -1px -1px var(--retro-win-dark),
          inset 1px 1px var(--retro-win-light),
          inset -2px -2px var(--retro-win-shadow);
        font: bold 11px/10px var(--retro-win-font);
        color: #000000;
        text-align: center;
      }
      .term {
        flex: 1;
        min-height: 0;
        margin-top: 2px;
        padding: 6px 8px;
        overflow: hidden;
        background: var(--retro-term-bg);
        box-shadow:
          inset 1px 1px var(--retro-win-shadow),
          inset -1px -1px var(--retro-win-light),
          inset 2px 2px var(--retro-win-dark);
        font-family: var(--retro-term-font);
        font-size: var(--retro-term-font-size);
        line-height: var(--retro-term-line-height);
        color: var(--retro-term-text);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .status {
        display: flex;
        gap: 2px;
        margin-top: 2px;
      }
      .status > span {
        padding: 1px 4px;
        box-shadow:
          inset 1px 1px var(--retro-win-shadow),
          inset -1px -1px var(--retro-win-light);
        white-space: nowrap;
      }
      .status .grow {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* chat log */
      .msg {
        margin-bottom: 4px;
        padding-left: 7ch;
        text-indent: -7ch;
      }
      .ts,
      .sys {
        color: var(--retro-term-dim);
      }
      .agent {
        color: var(--retro-chat-agent);
      }
      .visitor {
        color: var(--retro-chat-visitor);
      }
      .nick {
        font-weight: 600;
      }
      .composer {
        display: flex;
        gap: 1ch;
        margin-top: 2px;
        padding: 5px 8px;
        background: var(--retro-term-bg);
        box-shadow:
          inset 1px 1px var(--retro-win-shadow),
          inset -1px -1px var(--retro-win-light),
          inset 2px 2px var(--retro-win-dark);
        font: var(--retro-term-font-size) / var(--retro-term-line-height) var(--retro-term-font);
        color: var(--retro-chat-visitor);
      }
      .composer .ph {
        color: var(--retro-term-dim);
      }
      .caret {
        display: inline-block;
        width: 1ch;
        height: 1.1em;
        margin-bottom: -0.2em;
        background: currentColor;
        animation: blink 1s steps(1) infinite;
      }

      /* console */
      .console .term {
        font-size: var(--retro-code-font-size);
        line-height: var(--retro-code-line-height);
      }
      .ln {
        min-height: var(--retro-code-line-height);
        padding-left: 2ch;
        text-indent: -2ch;
      }
      .ln.add {
        background: var(--retro-code-add-bg);
      }
      .ln.del {
        background: var(--retro-code-del-bg);
        color: var(--retro-code-del);
      }
      .ln .g {
        display: inline-block;
        width: 2ch;
        text-indent: 0;
      }
      .ln.add .g {
        color: var(--retro-code-add);
      }
      .c-com {
        color: var(--retro-term-dim);
      }
      .c-sel {
        color: var(--retro-code-selector);
      }
      .c-prop {
        color: var(--retro-code-property);
      }
      .c-str {
        color: var(--retro-code-string);
      }
      .c-num {
        color: var(--retro-code-number);
      }
      .c-file {
        color: #ffffff;
        font-weight: 600;
      }
      .c-ok {
        color: var(--retro-code-add);
      }
      .c-step {
        color: #ffffff;
      }
      .c-prompt {
        color: #ffffff;
      }
      .progress {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 2px;
        padding: 3px 4px;
      }
      .progress .label {
        flex: none;
        width: 158px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .bar {
        flex: 1;
        height: 16px;
        padding: 2px;
        background: var(--retro-win-face);
        box-shadow:
          inset 1px 1px var(--retro-win-shadow),
          inset -1px -1px var(--retro-win-light);
      }
      .bar i {

      /* Same element types and hooks as the real components (src/screens/cv/*.tsx). */

      document.getElementById('main').innerHTML = `

      /* ------------------------------------------------------------------ decorations */
      const DECORATIONS = {
        'top-bar': `<nav><span>Home</span><span>Resume</span><span>My Apps</span><span>Books</span><span>Guestbook</span><span>Links</span></nav>

      /* ------------------------------------------------------------------ scenario (atomic, GRA-49) */
      // A chunk: [kind, id, target label, target selectors | 'page' | null]. One chunk = one change.
      const TECH = "[data-testid='cv-technology-card']";
      const LATEST = "[data-agent-id='section:latest-experience']";
      const STEPS = [
        {

            ['layer', 'type-faces', 'headings', ["[data-testid='cv-name']", 'h2']],

      // Chat up to the start of step `n` (its narration included); the exchange sits after step 2.
      const chatAt = (n) => [
        ...CHAT.open,
        ...CHAT.exchange,
        ...CHAT.console,
        ...STEPS.slice(0, n + 1).flatMap((s, i) => [
          ...(i === 2 ? CHAT.between : []),
          T(20, 15 + Math.floor(i / 3), 'agent', s.fallback),

      ];
      // at: [step, chunk, lines typed of that chunk]; chunks before it are applied.
      // hl: 'typing' marks the chunk being typed; 'applied' the chunk that just applied (its beat).
      const STATES = {
        broken: { at: [0, 0, 0], dock: false },
        chat: {
          at: [0, 0, 0],
          chat: [...CHAT.open, ...CHAT.exchange],
          typing: 'the purple name is a bold choice',

      const [atStep, atEffect, atLines] = st.at;
      const active = STEPS.flatMap((s, i) =>
        s.effects.filter((_, j) => i > atStep || (i === atStep && j >= atEffect)),

      const isActive = (kind, id) => active.some(([k, x]) => k === kind && x === id);

      /* ------------------------------------------------------------------ layer host */
      const url = (p) => new URL(p, location.href).href;
      const root = document.documentElement.style;

      const loads = active
        .filter(([k]) => k === 'layer')
        .map(
          ([, id]) =>
            new Promise((done) => {
              const link = Object.assign(document.createElement('link'), {
                rel: 'stylesheet',
                href: `layers/${id}.css`,

              link.dataset.retroLayer = id;
              link.onload = link.onerror = done;
              document.head.append(link);
            }),

      const docked = st.dock !== false && q.get('dock') !== '0';
      document.body.classList.toggle('docked', docked);

      /* Decorations: absolutely positioned over the page, anchored to hook elements. */
      const portal = document.getElementById('portal');
      for (const [k, id] of active) {
        if (k !== 'deco') continue;
        const el = Object.assign(document.createElement('div'), {
          id,
          className: 'deco',
          innerHTML: DECORATIONS[id],
        });
        portal.append(el);
      }
      const box = (sel) => {
        const r = document.querySelector(sel).getBoundingClientRect();
        return {
          left: r.left + scrollX,
          top: r.top + scrollY,
          right: r.right + scrollX,
          bottom: r.bottom + scrollY,
          width: r.width,
        };
      };
      const place = () => {
        const cv = box('[data-testid="cv"]');
        const set = (id, s) => {
          const el = document.getElementById(id);
          if (el) Object.assign(el.style, s);
        };
        set('top-bar', { left: `${cv.left}px`, top: `${cv.top}px`, width: `${cv.width}px` });
        set('page-footer', {
          left: `${cv.left}px`,
          top: `${cv.bottom - 200}px`,
          width: `${cv.width}px`,

        if (isActive('layer', 'page-frame')) {
          const main = box('main');
          const header = box('[data-agent-id="section:header"]');
          set('oh-snap', { left: `${main.right + 28}px`, top: `${header.top + 40}px` });
        } else {
          const photo = box('[data-agent-id="section:header"] > img');
          set('oh-snap', { left: `${photo.right + 28 - 184}px`, top: `${photo.top - 12}px` });
        }
      };
      const highlight = () => {
        if (!st.hl) return;
        const [step, chunk] = st.hl === 'applied' ? [atStep, atEffect - 1] : [atStep, atEffect];
        const targets = STEPS[step]?.effects[chunk]?.[3];
        if (!targets) return;
        const add = (cls) =>
          portal.append(
            Object.assign(document.createElement('div'), { className: `target-hl ${cls}` }),
          );
        if (targets === 'page') return add(`page ${st.hl}`);
        const offset = 4;
        for (const sel of targets)
          for (const el of document.querySelectorAll(`[data-retro-stage] ${sel}, #portal ${sel}`)) {
            const r = el.getBoundingClientRect();
            if (r.bottom < 0 || r.top > innerHeight || r.width === 0) continue;
            const box = Object.assign(document.createElement('div'), {
              className: `target-hl ${st.hl}`,
            });
            Object.assign(box.style, {
              left: `${r.left + scrollX - offset}px`,
              top: `${r.top + scrollY - offset}px`,
              width: `${r.width + 2 * offset}px`,
              height: `${r.height + 2 * offset}px`,
            });
            portal.append(box);
          }
      };
      Promise.all(loads)
        .then(() => document.fonts.ready)
        .then(place)
        .then(highlight);
      addEventListener('resize', place);

      /* ------------------------------------------------------------------ console text */
      const read = (path) => {
        try {
          const x = new XMLHttpRequest();
          x.open('GET', path, false);
          x.send();
          return x.responseText;
        } catch {
          return null;
        }
      };
      const liveTokens = Object.fromEntries(
        [...(read('../../../src/theme/tokens.css') || '').matchAll(/(--[\w-]+):\s*([^;]+);/g)].map(
          (m) => [m[1], m[2].replace(/\s+/g, ' ')],
        ),
      );
      const effectLines = (effect) => {
        const target = effect[2] ? [['com', `// → ${effect[2]}`]] : [];
        return [...target, ...codeLines(effect)];
      };
      const codeLines = ([kind, id]) => {
        if (kind === 'deco')
          return [
            ['js', `document.getElementById('${id}').remove();`],
            ['ok', `  ok ${id} removed`],
          ];
        if (kind === 'module')
          return [
            ['js', "const { ChatRoute } = await import('./chat');"],
            ['ok', '  ok chat button loaded'],
          ];
        const css = read(`layers/${id}.css`);
        if (css == null) return [['com', `// layers/${id}.css (open over http to see the code)`]];
        const head = [['file', `--- layers/${id}.css`]];
        if (css.trimStart().startsWith(':root')) {
          const decls = [...css.matchAll(/(--[\w-]+):\s*([^;]+);/g)];
          return [
            ...head,
            ...decls.flatMap(([, p, v]) => [
              ['del', `${p}: ${v};`],
              ['add', `${p}: ${liveTokens[p] ?? '?'};`],
            ]),
            ['ok', `  ok ${id} removed`],
          ];
        }
        const lines = css
          .split('\n')
          .filter((l) => l.trim())
          .map((l) => ['del', l]);
        return [...head, ...lines, ['ok', `  ok ${id} removed`]];
      };
      const consoleLines = [['prompt', '$ agent fix --live andrew-cv']];
      STEPS.forEach((s, i) => {
        const name = `${i + 1}/${STEPS.length} ${s.title}`;
        if (i < atStep) return consoleLines.push(['ok', `ok ${name}`]);
        if (i > atStep) return;
        consoleLines.push(['com', `// ${name}`]);
        s.effects.forEach((e, j) => {
          if (j < atEffect) consoleLines.push(...effectLines(e));
          if (j === atEffect) consoleLines.push(...effectLines(e).slice(0, atLines));
        });
        if (atEffect >= s.effects.length) consoleLines.push(['ok', `ok ${name}`]);
      });
      if (atStep >= STEPS.length)
        consoleLines.push(['prompt', '$'], ['ok', 'all fixes applied. Welcome to 2026.']);

      const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const hlCode = (s) =>
        esc(s)
          .replace(/\b(const|await|import|document)\b/g, '<span class="c-sel">$1</span>')
          .replace(/(@keyframes|@media|:root)/g, '<span class="c-num">$1</span>')
          .replace(/^(\s*)(--[\w-]+|[a-z-]+)(:\s)/, '$1<span class="c-prop">$2</span>$3')
          .replace(
            /(#[0-9a-f]{3,6}\b|\b\d+(?:px|%|fr|deg|s)?)(?![^<]*>)/gi,
            '<span class="c-num">$1</span>',
          );
      const hl = (s) =>
        s
          .split(/('[^']*')/)
          .map((part, i) => (i % 2 ? `<span class="c-str">${esc(part)}</span>` : hlCode(part)))
          .join('');
      const typing = atStep < STEPS.length && atEffect < STEPS[atStep].effects.length;
      const term = document.getElementById('console-term');
      term.innerHTML = consoleLines
        .map(([k, s], i) => {
          const caret =
            typing && i === consoleLines.length - 1 ? '<span class="caret"></span>' : '';
          switch (k) {
            case 'prompt':
              return `<div class="ln"><span class="c-prompt">${esc(s)}</span>${caret}</div>`;
            case 'com':
              return `<div class="ln"><span class="c-com">${esc(s)}</span>${caret}</div>`;
            case 'file':
              return `<div class="ln"><span class="c-file">${esc(s)}</span>${caret}</div>`;
            case 'add':
              return `<div class="ln add"><span class="g">+</span>${hl(s)}${caret}</div>`;
            case 'del':
              return `<div class="ln del"><span class="g">-</span>${esc(s)}${caret}</div>`;
            case 'js':
              return `<div class="ln"><span class="g"> </span>${hl(s)}${caret}</div>`;
            case 'ok':
              return `<div class="ln"><span class="c-ok">${esc(s).replace(/^(\s*)ok/, '$1&#10003;')}</span>${caret}</div>`;
            default:
              return `<div class="ln">${esc(s)}${caret}</div>`;
          }
        })
        .join('');

      const total = STEPS.length;
      const frac =
        atStep >= total ? total : atStep + Math.min(1, atEffect / STEPS[atStep].effects.length);
      const pct = Math.round((frac / total) * 100);
      const stepDone = atStep < total && atEffect >= STEPS[atStep].effects.length;
      const shown = Math.min(total, stepDone ? atStep + 2 : atStep + 1);
      document.getElementById('progress-label').textContent =
        pct === 100 ? 'All fixes applied' : `Step ${shown} of ${total}: ${STEPS[shown - 1].title}`;
      document.getElementById('progress-bar').style.width = `${pct}%`;
      document.getElementById('progress-pct').textContent = `${pct}%`;
      document.getElementById('console').style.display = st.console === false ? 'none' : '';

      /* ------------------------------------------------------------------ chat */
      const NICK = { agent: '&lt;agent&gt;', visitor: '&lt;you&gt;' };
      document.getElementById('chat-log').innerHTML = (st.chat || [])
        .map(([t, k, text]) =>
          k === 'sys'
            ? `<div class="msg sys"><span class="ts">[${t}]</span> ${esc(text)}</div>`
            : `<div class="msg ${k}"><span class="ts">[${t}]</span> <span class="nick">${NICK[k]}</span> ${esc(text)}</div>`,
        )
        .join('');
      document.getElementById('composer').innerHTML = st.typing
        ? `<span>you&gt;</span><span>${esc(st.typing)}<span class="caret"></span></span>`
        : `<span>you&gt;</span><span><span class="caret"></span><span class="ph"> type here, press Enter</span></span>`;
      for (const el of [term, document.getElementById('chat-log')]) el.scrollTop = el.scrollHeight;
    </script>
  </body>
</html>
