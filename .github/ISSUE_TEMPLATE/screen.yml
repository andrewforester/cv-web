name: Screen
description: A screen, or a new part of an existing screen, to build from a design package
labels: [screen]
body:
  - type: input
    id: spec
    attributes:
      label: Design package
      description: Path to the package, e.g. docs/design/<screen>/ (SPEC.md, screenshot.png, assets/). Sessions don't call design-tool MCPs.
  - type: input
    id: design_link
    attributes:
      label: Design-tool link
      description: Optional link to the frame. The coordinator exports it once into docs/design/<screen>/.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - New screen
        - New part of an existing screen
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What must stay untouched even if the design shows it.
      value: "- "
  - type: textarea
    id: behavior
    attributes:
      label: Behavior
      description: Taps, navigation, states (empty / loading / error), data source (mock or API endpoint)
  - type: textarea
    id: zone
    attributes:
      label: Zone (may change) / must not change
      description: See docs/COORDINATION.md → Hot spots.
      value: |
        May change:
        - <screen folder>/**
        - <screen data folder>/**
        - <screen tests>/**
        - <screen strings and images>
        Must not change: build files, theme, other screens, routing (unless stated)
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issues that must be in main first (and "Starts on branch of: #N" for a soft dependency)
      value: "Depends on: none"
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - Matches the design (web screenshot at the target viewport posted as an Issue comment, branch `screens`)
        - UI test for the screen
        - lint and test (CLAUDE.md → Commands) green
        - PR to main with "Closes #N"; process notes (deviations, stubs, questions) in Issue comments
