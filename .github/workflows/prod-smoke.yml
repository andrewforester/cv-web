name: Production smoke

# Checks the live production site. Production (production.yml -> smoke) calls it right after its
# deploy job promotes a deployment; a failure there rolls production back and leaves the
# Production run red. A daily scheduled run catches a site that broke without a merge (an expired
# key, a Vercel change): it only goes red, nothing is rolled back. workflow_dispatch smokes
# production by hand (no rollback either).
on:
  workflow_call:
    inputs:
      simulate_failure:
        description: Fail on purpose after the real checks (exercises the rollback in production.yml)
        type: boolean
        default: false
  workflow_dispatch:
  schedule:
    # 04:17 UTC: night in Europe, off the hour (scheduled runs queue up at :00).
    - cron: '17 4 * * *'

permissions:
  contents: read

env:
  # The production domain, not a per-deployment URL: those may sit behind Vercel Authentication.
  PW_BASE_URL: https://grandtorino.dev

jobs:
  prod-smoke:
    name: prod-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright-chromium
      - name: Playwright @prod subset
        run: npm run web-check:prod
      - name: /api/chat rejects GET with 405 JSON
        run: |
          set -euo pipefail
          out=$(mktemp)
          code=$(curl -sS -o "$out" -w '%{http_code}' "$PW_BASE_URL/api/chat")
          cat "$out"
          test "$code" = 405
          jq -e . "$out" > /dev/null
      - name: /api/voice-session rejects GET with 405 JSON
        run: |
          set -euo pipefail
          out=$(mktemp)
          code=$(curl -sS -o "$out" -w '%{http_code}' "$PW_BASE_URL/api/voice-session")
          cat "$out"
          test "$code" = 405
          jq -e . "$out" > /dev/null
      - name: Simulated smoke failure
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "::error::simulate_smoke_failure=true: failing the smoke on purpose"
          exit 1
      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-screenshots
          path: |
            web-check/
            test-results/
          if-no-files-found: ignore
