name: Production smoke

# Checks the live production site. CI calls it right after its deploy job promotes a deployment
# (ci.yml -> smoke); a failure there rolls production back and leaves the CI run red. It no
# longer listens to deployment_status: production is deployed by CI, not by Vercel's Git
# integration, so the smoke runs exactly once per deploy. workflow_dispatch smokes production
# by hand (no rollback).
on:
  workflow_call:
    inputs:
      simulate_failure:
        description: Fail on purpose after the real checks (exercises the rollback in ci.yml)
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

env:
  # The production domain, not a per-deployment URL: those may sit behind Vercel Authentication.
  PW_BASE_URL: https://cv-web-inky-five.vercel.app

jobs:
  prod-smoke:
    name: prod-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Playwright @prod subset
        run: npm run web-check:prod
      - name: /api/chat rejects GET with 405 JSON
        run: |
          set -euo pipefail
          out=$(mktemp)
          code=$(curl -sS -o "$out" -w '%{http_code}' "$PW_BASE_URL/api/chat")
          cat "$out"
          test "$code" = 405
          jq -e . "$out" > /dev/null
      - name: /api/voice-session rejects GET with 405 JSON
        run: |
          set -euo pipefail
          out=$(mktemp)
          code=$(curl -sS -o "$out" -w '%{http_code}' "$PW_BASE_URL/api/voice-session")
          cat "$out"
          test "$code" = 405
          jq -e . "$out" > /dev/null
      - name: Simulated smoke failure
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "::error::simulate_smoke_failure=true: failing the smoke on purpose"
          exit 1
      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-screenshots
          path: |
            web-check/
            test-results/
          if-no-files-found: ignore
