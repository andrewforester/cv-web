name: Checks

# The checks every level runs (Dev, Staging, Production call this workflow): *lint* and *test*
# (job Lint & tests) and the web build + Playwright e2e (job e2e). In GitHub they show as
# "Checks / Lint & tests" and "Checks / e2e" (the caller's job name first).
on:
  workflow_call:
    inputs:
      docs_only_base:
        description: >-
          Dev: the PR's base commit. When only docs/, .claude/ and *.md changed against it, e2e is
          skipped (Lint & tests still runs: prettier checks docs/design mocks). Empty: e2e always
          runs.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test

  # Same rule as the production docs-only skip (scripts/vercel-ignore.sh).
  changes:
    name: Changed paths
    if: ${{ inputs.docs_only_base != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Docs-only change?
        id: diff
        env:
          BASE_SHA: ${{ inputs.docs_only_base }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          if [ -n "$changed" ] && ! grep -qvE '^(docs/|\.claude/)|\.md$' <<< "$changed"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Only docs/, .claude/ and *.md changed: e2e is skipped."
          fi

  e2e:
    name: e2e
    needs: changes
    # Runs unless the change is docs-only; also when Changed paths was skipped or failed.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build:e2e
      - uses: ./.github/workflows/playwright-chromium
      - name: Playwright e2e
        run: npm run web-check
      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            web-check/
            test-results/
          if-no-files-found: ignore
