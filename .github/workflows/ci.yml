name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # The CI-watch PR (main -> ci-watch) only relays main's push runs to the QA session.
    branches-ignore: [ci-watch]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# PRs run lint and tests plus a web build + Playwright smoke test (web-smoke).
# The web is deployed by Vercel's GitHub App (production = main, a preview per PR), not by CI. Pushes to feature
# branches trigger nothing: sessions run lint and test locally, the PR re-checks it.
# Draft PRs run nothing: the orchestrator opens the PR as a draft before work starts,
# and CI runs once the developer marks it Ready for review (and on every push after that).
jobs:
  checks:
    name: Lint & tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test

  web-smoke:
    name: web-smoke
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright startup check
        run: npm run web-check
      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-screenshots
          path: |
            web-check/
            test-results/
          if-no-files-found: ignore
