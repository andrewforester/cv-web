name: Stack Overflow stats

# Weekly refresh of the `stackOverflow` block in src/data/cv/cvPage.json (CV-174). When a number
# changed the bot commits straight to the branch it runs on (the one exception to "main only via
# PRs", for this data block only). GitHub runs schedule/workflow_dispatch only for the default
# branch's workflow, so in practice that branch is main.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: stackoverflow-stats
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh stats
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fetch stats and update the CV JSON
        run: node scripts/stackOverflowStats.ts
      - name: Commit, push and start CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/cv/cvPage.json; then
            echo 'No change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/cv/cvPage.json
          git commit -m "Stack Overflow stats: $(date -u +%F)"
          git push
          # A push made with GITHUB_TOKEN does not trigger CI; start it so production redeploys.
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
